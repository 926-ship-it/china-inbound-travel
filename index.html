<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Your all-in-one gateway to China: flight deals, custom tours, shopping, medical wellness, and 240-hour visa-free transit guide." />
  <title>Your Gateway to China — One-Stop Entry Travel Platform</title>
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500&display=swap" />
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" />
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>

    :root {
      /* Core palette */
      --vermilion: #B8342E;
      --vermilion-dark: #8A2420;
      --vermilion-light: #D4544E;
      --indigo: #1E2A5E;
      --indigo-light: #2D3D7A;
      --indigo-deep: #0F1840;
      --warm-gold: #C9A961;
      --warm-gold-light: #E0C88A;
      --warm-gold-dark: #A88942;
      --ivory: #FAF6EE;
      --ivory-2: #F2EBDD;
      --celadon: #2A9D8F;
      --celadon-dark: #1F7A6E;
      --celadon-light: #3DB8A9;

      /* Neutrals */
      --ink: #1A1A1A;
      --ink-2: #333;
      --muted: #6B6B6B;
      --border: #E5DFD2;

      /* Shadows */
      --shadow-sm: 0 1px 2px rgba(30, 42, 94, 0.06);
      --shadow-md: 0 4px 16px rgba(30, 42, 94, 0.08);
      --shadow-lg: 0 12px 40px rgba(30, 42, 94, 0.12);
      --shadow-gold: 0 4px 20px rgba(201, 169, 97, 0.25);

      /* Typography */
      --font-display: 'Playfair Display', 'Noto Serif SC', Georgia, serif;
      --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

      /* Layout */
      --nav-height: 72px;
      --max-w: 1280px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: var(--font-body);
      color: var(--ink);
      background: var(--ivory);
      line-height: 1.6;
      font-size: 16px;
      overflow-x: hidden;
    }

    /* Silk texture background */
    .silk-bg {
      background-color: var(--ivory);
      background-image:
        radial-gradient(ellipse at 20% 0%, rgba(201, 169, 97, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(184, 52, 46, 0.04) 0%, transparent 50%);
    }

    /* Chinese lattice pattern divider */
    .lattice-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin: 0 auto;
    }
    .lattice-divider::before,
    .lattice-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--warm-gold), transparent);
      opacity: 0.5;
    }
    .lattice-divider svg { color: var(--warm-gold); opacity: 0.7; }

    /* Scroll reveal animation */
    .reveal {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .reveal.is-visible {
      opacity: 1;
      transform: translateY(0);
    }
    .reveal.delay-1 { transition-delay: 0.1s; }
    .reveal.delay-2 { transition-delay: 0.2s; }
    .reveal.delay-3 { transition-delay: 0.3s; }
    .reveal.delay-4 { transition-delay: 0.4s; }

    /* Card hover */
    .card-hover {
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .card-hover:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-lg);
    }

    /* Utility */
    .container {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0 24px;
    }

    .display-font { font-family: var(--font-display); }

    .text-vermilion { color: var(--vermilion); }
    .text-indigo { color: var(--indigo); }
    .text-gold { color: var(--warm-gold); }
    .text-celadon { color: var(--celadon); }

    .bg-vermilion { background: var(--vermilion); }
    .bg-indigo { background: var(--indigo); }
    .bg-gold { background: var(--warm-gold); }
    .bg-ivory { background: var(--ivory); }
    .bg-celadon { background: var(--celadon); }

    .eyebrow {
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--warm-gold);
    }

    /* ===== Buttons ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.02em;
      padding: 12px 24px;
      border-radius: 2px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.25s ease;
      white-space: nowrap;
    }
    .btn-primary {
      background: var(--vermilion);
      color: var(--ivory);
      box-shadow: 0 2px 8px rgba(184, 52, 46, 0.3);
    }
    .btn-primary:hover {
      background: var(--vermilion-dark);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(184, 52, 46, 0.4);
    }
    .btn-outline {
      background: transparent;
      color: var(--ivory);
      border: 1px solid var(--warm-gold);
    }
    .btn-outline:hover {
      background: var(--warm-gold);
      color: var(--indigo-deep);
    }
    .btn-outline-dark {
      background: transparent;
      color: var(--vermilion);
      border: 1px solid var(--vermilion);
    }
    .btn-outline-dark:hover {
      background: var(--vermilion);
      color: var(--ivory);
    }
    .btn-gold {
      background: var(--warm-gold);
      color: var(--indigo-deep);
    }
    .btn-gold:hover {
      background: var(--warm-gold-dark);
      transform: translateY(-1px);
    }
    .btn-sm { padding: 8px 16px; font-size: 13px; }
    .btn-lg { padding: 16px 32px; font-size: 16px; }

    /* ===== Navigation ===== */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--nav-height);
      z-index: 100;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      background: transparent;
    }
    .nav.scrolled {
      background: rgba(250, 246, 238, 0.95);
      backdrop-filter: blur(12px);
      box-shadow: 0 1px 0 var(--border);
    }
    .nav.dark-scrolled {
      background: rgba(15, 24, 64, 0.92);
      backdrop-filter: blur(12px);
      box-shadow: 0 1px 0 rgba(201, 169, 97, 0.2);
    }

    .nav-logo {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
      color: var(--ivory);
      text-decoration: none;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav.scrolled .nav-logo {
      color: var(--vermilion);
    }
    .nav-logo-mark {
      width: 32px;
      height: 32px;
      border: 1.5px solid var(--warm-gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: var(--warm-gold);
      border-radius: 2px;
    }

    .nav-menu {
      display: flex;
      align-items: center;
      gap: 4px;
      list-style: none;
    }

    .nav-item {
      position: relative;
    }
    .nav-link {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 500;
      color: var(--ivory);
      text-decoration: none;
      cursor: pointer;
      transition: color 0.2s ease;
      border-radius: 2px;
    }
    .nav.scrolled .nav-link {
      color: var(--ink);
    }
    .nav-link:hover {
      color: var(--warm-gold);
    }
    .nav.scrolled .nav-link:hover {
      color: var(--vermilion);
    }
    .nav-link svg.chevron {
      width: 12px;
      height: 12px;
      transition: transform 0.2s ease;
    }
    .nav-item:hover .nav-link svg.chevron {
      transform: rotate(180deg);
    }

    /* Dropdown */
    .dropdown {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      min-width: 320px;
      background: var(--ivory);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 12px;
      box-shadow: var(--shadow-lg);
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }
    .nav-item:hover .dropdown {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    .dropdown-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px;
      border-radius: 4px;
      text-decoration: none;
      color: var(--ink);
      transition: all 0.2s ease;
    }
    .dropdown-item:hover {
      background: var(--ivory-2);
    }
    .dropdown-item-icon {
      width: 40px;
      height: 40px;
      min-width: 40px;
      background: linear-gradient(135deg, rgba(184, 52, 46, 0.08), rgba(201, 169, 97, 0.08));
      border: 1px solid var(--border);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--vermilion);
    }
    .dropdown-item-text h4 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 2px;
      color: var(--ink);
    }
    .dropdown-item-text p {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .lang-toggle {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(201, 169, 97, 0.3);
      border-radius: 2px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: var(--ivory);
      transition: all 0.2s ease;
    }
    .nav.scrolled .lang-toggle {
      color: var(--ink);
      border-color: var(--border);
      background: var(--ivory-2);
    }
    .lang-toggle:hover {
      border-color: var(--warm-gold);
    }
    .lang-sep {
      width: 1px;
      height: 16px;
      background: rgba(201, 169, 97, 0.3);
    }
    .nav.scrolled .lang-sep {
      background: var(--border);
    }
    .lang-option {
      opacity: 0.5;
      transition: opacity 0.2s ease;
    }
    .lang-option.active {
      opacity: 1;
      color: var(--warm-gold);
    }
    .nav.scrolled .lang-option.active {
      color: var(--vermilion);
    }

    .hamburger {
      display: none;
      width: 32px;
      height: 32px;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      padding: 4px;
    }
    .hamburger span {
      width: 24px;
      height: 2px;
      background: var(--ivory);
      transition: all 0.3s ease;
    }
    .nav.scrolled .hamburger span {
      background: var(--ink);
    }
    .hamburger.open span:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
    }
    .hamburger.open span:nth-child(2) {
      opacity: 0;
    }
    .hamburger.open span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
    }

    /* Mobile menu */
    .mobile-menu {
      display: none;
      position: fixed;
      top: var(--nav-height);
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--ivory);
      padding: 24px;
      overflow-y: auto;
      z-index: 99;
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .mobile-menu.open {
      transform: translateX(0);
    }
    .mobile-nav-group {
      margin-bottom: 24px;
    }
    .mobile-nav-label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--warm-gold-dark);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .mobile-nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      color: var(--ink);
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      border-bottom: 1px solid var(--border);
    }
    .mobile-nav-item:last-child { border-bottom: none; }
    .mobile-nav-item-icon {
      width: 32px;
      height: 32px;
      min-width: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--vermilion);
      background: var(--ivory-2);
      border-radius: 4px;
    }

    /* ===== Hero ===== */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding-top: var(--nav-height);
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
    }
    .hero-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .hero-overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(15, 24, 64, 0.5) 0%, rgba(15, 24, 64, 0.7) 100%),
        linear-gradient(90deg, rgba(15, 24, 64, 0.4) 0%, transparent 50%);
      z-index: 1;
    }
    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 900px;
      padding: 0 24px;
      color: var(--ivory);
    }
    .hero-eyebrow {
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--warm-gold-light);
      margin-bottom: 24px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }
    .hero-eyebrow::before,
    .hero-eyebrow::after {
      content: '';
      width: 32px;
      height: 1px;
      background: var(--warm-gold);
    }
    .hero h1 {
      font-family: var(--font-display);
      font-size: clamp(42px, 7vw, 82px);
      font-weight: 700;
      line-height: 1.05;
      margin-bottom: 24px;
      letter-spacing: -0.01em;
      text-wrap: pretty;
    }
    .hero h1 .highlight {
      font-style: italic;
      color: var(--warm-gold-light);
      font-weight: 400;
    }
    .hero-subtitle {
      font-size: clamp(16px, 2vw, 20px);
      line-height: 1.7;
      color: rgba(250, 246, 238, 0.85);
      margin-bottom: 40px;
      max-width: 640px;
      margin-left: auto;
      margin-right: auto;
    }
    .hero-ctas {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .hero-scroll-hint {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      color: rgba(250, 246, 238, 0.6);
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      animation: float 2.5s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(8px); }
    }

    /* ===== Trust Bar ===== */
    .trust-bar {
      background: var(--indigo-deep);
      padding: 48px 0;
      border-top: 1px solid rgba(201, 169, 97, 0.2);
      border-bottom: 1px solid rgba(201, 169, 97, 0.2);
    }
    .trust-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 32px;
    }
    .trust-item {
      text-align: center;
      padding: 16px;
    }
    .trust-number {
      font-family: var(--font-display);
      font-size: 40px;
      font-weight: 700;
      color: var(--warm-gold);
      margin-bottom: 8px;
      line-height: 1;
    }
    .trust-label {
      font-size: 13px;
      color: rgba(250, 246, 238, 0.7);
      letter-spacing: 0.02em;
    }

    /* ===== Section Base ===== */
    .section {
      padding: 100px 0;
    }
    .section-indigo {
      background: var(--indigo-deep);
      color: var(--ivory);
    }
    .section-celadon {
      background: linear-gradient(135deg, #1F3A36 0%, #2A9D8F 50%, #3DB8A9 100%);
      color: var(--ivory);
      position: relative;
    }
    .section-header {
      text-align: center;
      max-width: 720px;
      margin: 0 auto 64px;
    }
    .section-header h2 {
      font-family: var(--font-display);
      font-size: clamp(32px, 4.5vw, 52px);
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 16px;
      letter-spacing: -0.01em;
      text-wrap: pretty;
    }
    .section-header p {
      font-size: 16px;
      line-height: 1.7;
      color: var(--muted);
    }
    .section-indigo .section-header p,
    .section-celadon .section-header p {
      color: rgba(250, 246, 238, 0.7);
    }
    .section-header .eyebrow { margin-bottom: 16px; }
    .section-divider {
      width: 64px;
      height: 1px;
      background: var(--warm-gold);
      margin: 20px auto 0;
    }

    /* ===== Flight Deals ===== */
    .flight-tabs {
      display: flex;
      justify-content: center;
      gap: 4px;
      margin-bottom: 48px;
    }
    .flight-tab {
      padding: 12px 28px;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: var(--font-body);
    }
    .flight-tab:hover {
      color: var(--ink);
    }
    .flight-tab.active {
      color: var(--vermilion);
      border-bottom-color: var(--vermilion);
    }
    .section-indigo .flight-tab {
      color: rgba(250, 246, 238, 0.6);
    }
    .section-indigo .flight-tab:hover {
      color: var(--ivory);
    }
    .section-indigo .flight-tab.active {
      color: var(--warm-gold);
      border-bottom-color: var(--warm-gold);
    }

    .flight-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 20px;
    }
    .flight-card {
      background: var(--ivory);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }
    .flight-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--vermilion), var(--warm-gold));
    }
    .flight-deal-tag {
      display: inline-block;
      background: var(--vermilion);
      color: var(--ivory);
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 2px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .flight-deal-tag-inline {
      display: inline-block;
      background: var(--vermilion);
      color: var(--ivory);
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 2px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-left: 8px;
      vertical-align: middle;
    }
    .flight-route {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }
    .flight-city {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      color: var(--ink);
    }
    .flight-city-code {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .flight-arrow {
      flex: 1;
      display: flex;
      align-items: center;
      color: var(--warm-gold);
      position: relative;
    }
    .flight-arrow::before {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .flight-arrow svg {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      background: var(--ivory);
      padding: 0 6px;
    }
    .flight-airline {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px dashed var(--border);
    }
    .flight-price-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }
    .flight-price {
      display: flex;
      flex-direction: column;
    }
    .flight-price-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 4px;
      display: inline-block;
    }
    .flight-price-label-row {
      display: flex;
      align-items: center;
      margin-bottom: 4px;
    }
    .flight-price-amount {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 700;
      color: var(--vermilion);
      line-height: 1;
    }
    .flight-price-original {
      font-size: 13px;
      color: var(--muted);
      text-decoration: line-through;
      margin-top: 4px;
    }
    .view-all-link {
      text-align: center;
      margin-top: 48px;
    }
    .view-all-link a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--vermilion);
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      border-bottom: 1px solid var(--vermilion);
      padding-bottom: 2px;
      transition: all 0.2s ease;
    }
    .view-all-link a:hover {
      gap: 12px;
    }
    .section-indigo .view-all-link a {
      color: var(--warm-gold);
      border-bottom-color: var(--warm-gold);
    }

    /* ===== Travel Cards ===== */
    .travel-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 20px;
    }
    .travel-card {
      background: var(--ivory);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 28px 20px;
      text-align: center;
      text-decoration: none;
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      transition: all 0.3s ease;
      position: relative;
    }
    .travel-card::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 2px;
      background: var(--vermilion);
      transition: width 0.3s ease;
    }
    .travel-card:hover::after {
      width: 60%;
    }
    .travel-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: rgba(184, 52, 46, 0.2);
    }
    .travel-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(184, 52, 46, 0.08), rgba(201, 169, 97, 0.1));
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--vermilion);
      margin-bottom: 4px;
      transition: all 0.3s ease;
    }
    .travel-card:hover .travel-icon {
      background: var(--vermilion);
      color: var(--ivory);
      transform: scale(1.05);
    }
    .travel-card h3 {
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 2px;
    }
    .travel-card p {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }
    .travel-card .explore-link {
      margin-top: auto;
      padding-top: 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--vermilion);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .travel-card.featured {
      background: linear-gradient(135deg, var(--vermilion) 0%, var(--vermilion-dark) 100%);
      color: var(--ivory);
      border-color: var(--vermilion);
    }
    .travel-card.featured .travel-icon {
      background: rgba(250, 246, 238, 0.15);
      color: var(--warm-gold-light);
    }
    .travel-card.featured:hover .travel-icon {
      background: var(--warm-gold);
      color: var(--vermilion-dark);
    }
    .travel-card.featured h3 { color: var(--ivory); }
    .travel-card.featured p { color: rgba(250, 246, 238, 0.75); }
    .travel-card.featured .explore-link { color: var(--warm-gold-light); }
    .travel-card.featured::after { background: var(--warm-gold); }

    /* ===== Shop Module ===== */
    .shop-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
    }
    .shop-card {
      position: relative;
      border-radius: 6px;
      overflow: hidden;
      min-height: 420px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 40px;
      text-decoration: none;
      color: var(--ivory);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }
    .shop-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-lg);
    }
    .shop-card-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
    }
    .shop-card-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s ease;
    }
    .shop-card:hover .shop-card-bg img {
      transform: scale(1.05);
    }
    .shop-card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(15, 24, 64, 0.2) 0%, rgba(15, 24, 64, 0.85) 100%);
      z-index: 1;
    }
    .shop-card-content {
      position: relative;
      z-index: 2;
    }
    .shop-card-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--warm-gold-light);
      margin-bottom: 16px;
    }
    .shop-card h3 {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 12px;
      line-height: 1.1;
    }
    .shop-card p {
      font-size: 14px;
      color: rgba(250, 246, 238, 0.8);
      line-height: 1.6;
      margin-bottom: 24px;
      max-width: 360px;
    }
    .shop-card-features {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }
    .shop-feature-chip {
      font-size: 11px;
      font-weight: 500;
      padding: 4px 10px;
      background: rgba(250, 246, 238, 0.15);
      border: 1px solid rgba(201, 169, 97, 0.3);
      border-radius: 20px;
      color: var(--ivory);
    }

    /* ===== Medical Module ===== */
    .medical-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
    }
    .medical-card {
      background: rgba(250, 246, 238, 0.08);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(250, 246, 238, 0.15);
      border-radius: 6px;
      padding: 28px 20px;
      text-align: center;
      transition: all 0.3s ease;
    }
    .medical-card:hover {
      background: rgba(250, 246, 238, 0.15);
      border-color: var(--warm-gold-light);
      transform: translateY(-4px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }
    .medical-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
      background: rgba(201, 169, 97, 0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--warm-gold-light);
    }
    .medical-card h3 {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--ivory);
    }
    .medical-card p {
      font-size: 12px;
      color: rgba(250, 246, 238, 0.7);
      line-height: 1.5;
      margin-bottom: 12px;
    }
    .medical-price {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 600;
      color: var(--warm-gold-light);
      margin-bottom: 16px;
    }
    .medical-card .book-btn {
      font-size: 11px;
      font-weight: 600;
      padding: 8px 16px;
      border: 1px solid var(--warm-gold-light);
      color: var(--warm-gold-light);
      background: transparent;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .medical-card .book-btn:hover {
      background: var(--warm-gold-light);
      color: var(--celadon-dark);
    }

    /* ===== Visa-Free Module ===== */
    .visa-module {
      position: relative;
      overflow: hidden;
    }
    .visa-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 64px;
      align-items: center;
    }
    .visa-info h2 {
      font-family: var(--font-display);
      font-size: clamp(32px, 4.5vw, 48px);
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 20px;
    }
    .visa-info p {
      font-size: 16px;
      line-height: 1.7;
      color: rgba(250, 246, 238, 0.8);
      margin-bottom: 24px;
    }
    .visa-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 32px;
    }
    .visa-stat {
      padding: 16px;
      background: rgba(201, 169, 97, 0.1);
      border: 1px solid rgba(201, 169, 97, 0.2);
      border-radius: 4px;
    }
    .visa-stat-num {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 700;
      color: var(--warm-gold);
      margin-bottom: 4px;
    }
    .visa-stat-label {
      font-size: 12px;
      color: rgba(250, 246, 238, 0.7);
    }
    .visa-visual {
      position: relative;
      display: flex;
      justify-content: center;
    }
    .passport-card {
      background: var(--ivory);
      border-radius: 8px;
      padding: 32px;
      width: 360px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.3);
      position: relative;
      color: var(--ink);
    }
    .passport-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .passport-stamp {
      width: 48px;
      height: 48px;
      border: 2px solid var(--vermilion);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 700;
      color: var(--vermilion);
      font-size: 14px;
    }
    .passport-title h3 {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 2px;
    }
    .passport-title p {
      font-size: 12px;
      color: var(--muted);
    }
    .passport-detail {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px dashed var(--border);
      font-size: 13px;
    }
    .passport-detail:last-child { border-bottom: none; }
    .passport-detail-label { color: var(--muted); }
    .passport-detail-value { font-weight: 600; }

    /* ===== Testimonials ===== */
    .testimonial-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }
    .testimonial-card {
      background: var(--ivory);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 28px;
      transition: all 0.3s ease;
    }
    .testimonial-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
    }
    .testimonial-stars {
      color: var(--warm-gold);
      margin-bottom: 16px;
      display: flex;
      gap: 2px;
    }
    .testimonial-text {
      font-size: 14px;
      line-height: 1.7;
      color: var(--ink-2);
      margin-bottom: 20px;
      font-style: italic;
    }
    .testimonial-author {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .testimonial-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--vermilion), var(--warm-gold));
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ivory);
      font-weight: 700;
      font-size: 14px;
    }
    .testimonial-author-info h4 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 2px;
    }
    .testimonial-author-info p {
      font-size: 12px;
      color: var(--muted);
    }
    .trustpilot-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 48px;
      flex-wrap: wrap;
    }
    .trustpilot-logo {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      color: #00B67A;
    }
    .trustpilot-rating {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--muted);
    }
    .trustpilot-rating strong { color: var(--ink); }

    /* ===== Social Section ===== */
    .social-section {
      background: var(--ivory-2);
      padding: 80px 0;
    }
    .social-content {
      text-align: center;
      max-width: 600px;
      margin: 0 auto 40px;
    }
    .social-content h2 {
      font-family: var(--font-display);
      font-size: clamp(28px, 4vw, 40px);
      font-weight: 700;
      margin-bottom: 12px;
    }
    .social-content p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }
    .social-icons {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 28px;
    }
    .social-icon {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--ivory);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      transition: all 0.25s ease;
      cursor: pointer;
    }
    .social-icon:hover {
      background: var(--vermilion);
      color: var(--ivory);
      border-color: var(--vermilion);
      transform: translateY(-3px);
    }

    /* ===== Footer ===== */
    .footer {
      background: var(--indigo-deep);
      color: var(--ivory);
      padding: 80px 0 32px;
    }
    .footer-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr 1fr 1.2fr;
      gap: 40px;
      margin-bottom: 60px;
    }
    .footer-brand h3 {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .footer-brand p {
      font-size: 13px;
      color: rgba(250, 246, 238, 0.6);
      line-height: 1.6;
      margin-bottom: 20px;
      max-width: 240px;
    }
    .footer-col h4 {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 20px;
      color: var(--warm-gold-light);
    }
    .footer-col ul { list-style: none; }
    .footer-col li {
      margin-bottom: 10px;
    }
    .footer-col a {
      font-size: 13px;
      color: rgba(250, 246, 238, 0.7);
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .footer-col a:hover {
      color: var(--warm-gold-light);
    }
    .newsletter p {
      font-size: 13px;
      color: rgba(250, 246, 238, 0.7);
      margin-bottom: 14px;
      line-height: 1.6;
    }
    .newsletter-form {
      display: flex;
      gap: 0;
      border: 1px solid rgba(201, 169, 97, 0.3);
      border-radius: 2px;
      overflow: hidden;
    }
    .newsletter-form input {
      flex: 1;
      padding: 10px 14px;
      background: transparent;
      border: none;
      color: var(--ivory);
      font-size: 13px;
      font-family: var(--font-body);
      outline: none;
    }
    .newsletter-form input::placeholder {
      color: rgba(250, 246, 238, 0.4);
    }
    .newsletter-form button {
      padding: 10px 16px;
      background: var(--warm-gold);
      border: none;
      color: var(--indigo-deep);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .newsletter-form button:hover {
      background: var(--warm-gold-dark);
    }
    .footer-bottom {
      padding-top: 32px;
      border-top: 1px solid rgba(201, 169, 97, 0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: rgba(250, 246, 238, 0.5);
      flex-wrap: wrap;
      gap: 16px;
    }
    .footer-bottom-links {
      display: flex;
      gap: 20px;
    }
    .footer-bottom-links a {
      color: rgba(250, 246, 238, 0.5);
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .footer-bottom-links a:hover { color: var(--warm-gold-light); }

    /* ===== Start Planning Page ===== */
    .planning-hero {
      padding: 140px 0 60px;
      background: linear-gradient(180deg, var(--indigo-deep) 0%, var(--indigo) 100%);
      color: var(--ivory);
      position: relative;
      overflow: hidden;
    }
    .planning-hero::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -10%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(201, 169, 97, 0.15) 0%, transparent 70%);
      border-radius: 50%;
    }
    .planning-hero::after {
      content: '';
      position: absolute;
      bottom: -30%;
      left: -5%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(184, 52, 46, 0.1) 0%, transparent 70%);
      border-radius: 50%;
    }
    .planning-hero .section-header {
      text-align: center;
      max-width: 720px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }
    .planning-hero .eyebrow {
      color: var(--warm-gold-light);
    }
    .planning-title {
      font-family: var(--font-display);
      font-size: clamp(32px, 5vw, 56px);
      font-weight: 700;
      line-height: 1.2;
      margin: 16px 0;
      color: var(--ivory);
    }
    .planning-subtitle {
      font-size: clamp(14px, 2vw, 18px);
      color: rgba(250, 246, 238, 0.75);
      max-width: 580px;
      margin: 0 auto;
      line-height: 1.7;
    }

    .planning-main {
      padding: 60px 0 100px;
      background: var(--ivory);
    }
    .planning-grid {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 40px;
      align-items: start;
    }

    /* Form column */
    .planning-form-col {
      background: white;
      border-radius: 16px;
      padding: 40px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
    }

    .form-progress {
      margin-bottom: 32px;
    }
    .progress-bar {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--vermilion), var(--warm-gold));
      border-radius: 2px;
      transition: width 0.4s ease;
    }
    .progress-steps {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .progress-step {
      display: flex;
      align-items: center;
      gap: 8px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      text-align: left;
      flex: 1;
    }
    .step-num {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--border);
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }
    .progress-step.active .step-num {
      background: var(--vermilion);
      color: white;
      box-shadow: 0 2px 8px rgba(184, 52, 46, 0.3);
    }
    .progress-step.done .step-num {
      background: var(--warm-gold);
      color: white;
    }
    .step-label {
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
      display: none;
    }
    @media (min-width: 768px) {
      .step-label {
        display: block;
      }
    }
    .progress-step.active .step-label {
      color: var(--ink);
      font-weight: 600;
    }

    .form-step-content {
      min-height: 320px;
    }
    .step-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .step-title {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      color: var(--indigo);
      margin-bottom: 24px;
    }
    .step-header .step-title {
      margin-bottom: 0;
    }
    .link-btn {
      background: none;
      border: none;
      color: var(--vermilion);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 8px;
    }
    .link-btn:hover {
      text-decoration: underline;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-2);
    }
    .form-group input,
    .form-group select,
    .form-step textarea {
      padding: 12px 16px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: var(--font-body);
      background: white;
      transition: all 0.2s ease;
      color: var(--ink);
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-step textarea:focus {
      outline: none;
      border-color: var(--vermilion);
      box-shadow: 0 0 0 3px rgba(184, 52, 46, 0.1);
    }
    .form-step textarea {
      width: 100%;
      resize: vertical;
      font-family: var(--font-body);
    }

    .traveler-row {
      display: flex;
      gap: 12px;
    }
    .traveler-count {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }
    .traveler-count button {
      width: 32px;
      height: 32px;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      background: white;
      cursor: pointer;
      font-size: 16px;
      color: var(--ink-2);
      transition: all 0.2s;
    }
    .traveler-count button:hover {
      border-color: var(--vermilion);
      color: var(--vermilion);
    }
    .traveler-count span {
      flex: 1;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-2);
    }

    /* Checkbox grid */
    .checkbox-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .checkbox-card {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: white;
    }
    .checkbox-card:hover {
      border-color: var(--warm-gold);
    }
    .checkbox-card.checked {
      border-color: var(--vermilion);
      background: rgba(184, 52, 46, 0.04);
    }
    .checkbox-card input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .checkbox-card-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-2);
    }
    .checkbox-card.checked .checkbox-card-label {
      color: var(--vermilion);
      font-weight: 600;
    }
    .checkbox-tag {
      margin-left: auto;
      font-size: 10px;
      padding: 2px 6px;
      background: var(--warm-gold);
      color: white;
      border-radius: 3px;
      font-weight: 600;
    }

    /* Interest chips */
    .interest-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .interest-chip {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 24px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: white;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-2);
    }
    .interest-chip:hover {
      border-color: var(--warm-gold);
      color: var(--indigo);
    }
    .interest-chip.checked {
      border-color: var(--indigo);
      background: var(--indigo);
      color: var(--ivory);
    }
    .interest-chip input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .chip-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--warm-gold);
    }
    .interest-chip.checked .chip-dot {
      background: var(--warm-gold-light);
    }

    /* Budget options */
    .budget-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .budget-option {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: white;
    }
    .budget-option:hover {
      border-color: var(--warm-gold);
    }
    .budget-option.checked {
      border-color: var(--vermilion);
      background: rgba(184, 52, 46, 0.04);
    }
    .budget-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .budget-radio {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-radius: 50%;
      flex-shrink: 0;
      position: relative;
      transition: all 0.2s;
    }
    .budget-option.checked .budget-radio {
      border-color: var(--vermilion);
    }
    .budget-option.checked .budget-radio::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 10px;
      height: 10px;
      background: var(--vermilion);
      border-radius: 50%;
    }
    .budget-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--ink-2);
    }
    .budget-option.checked .budget-label {
      color: var(--vermilion);
      font-weight: 600;
    }

    /* Form trust */
    .form-trust {
      margin-top: 32px;
      padding: 24px;
      background: linear-gradient(135deg, rgba(201, 169, 97, 0.08), rgba(184, 52, 46, 0.04));
      border-radius: 12px;
      border: 1px solid rgba(201, 169, 97, 0.2);
    }
    .form-trust h4 {
      font-family: var(--font-display);
      font-size: 16px;
      color: var(--indigo);
      margin-bottom: 16px;
    }
    .trust-items {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .trust-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--ink-2);
      font-weight: 500;
    }
    .trust-item svg {
      color: var(--celadon);
      flex-shrink: 0;
    }

    /* Form nav */
    .form-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }
    .btn-ghost {
      background: none;
      border: 1.5px solid var(--border);
      color: var(--muted);
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-ghost:hover:not(:disabled) {
      border-color: var(--muted);
      color: var(--ink);
    }
    .btn-ghost:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Success state */
    .planning-success {
      text-align: center;
      padding: 60px 40px;
    }
    .success-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, var(--celadon), var(--celadon-light));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    .planning-success h2 {
      font-family: var(--font-display);
      font-size: 28px;
      color: var(--indigo);
      margin-bottom: 12px;
    }
    .planning-success p {
      color: var(--muted);
      margin-bottom: 32px;
      max-width: 420px;
      margin-left: auto;
      margin-right: auto;
    }

    /* Sidebar */
    .planning-sidebar {
      display: flex;
      flex-direction: column;
      gap: 24px;
      position: sticky;
      top: 92px;
    }
    .sidebar-card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
    }
    .sidebar-title {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
      color: var(--indigo);
      margin-bottom: 18px;
    }

    .why-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .why-item {
      display: flex;
      gap: 14px;
    }
    .why-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(184, 52, 46, 0.1), rgba(201, 169, 97, 0.1));
      color: var(--vermilion);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .why-item h4 {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 2px;
    }
    .why-item p {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    /* Tour mini cards */
    .tour-mini-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .tour-mini-card {
      display: flex;
      gap: 12px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      transition: all 0.2s;
    }
    .tour-mini-card:hover {
      border-color: var(--warm-gold);
      transform: translateX(4px);
    }
    .tour-mini-img {
      width: 64px;
      height: 64px;
      border-radius: 8px;
      flex-shrink: 0;
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      padding: 4px 8px;
    }
    .tour-mini-days {
      font-size: 10px;
      font-weight: 700;
      color: white;
      background: rgba(0, 0, 0, 0.25);
      padding: 2px 6px;
      border-radius: 3px;
    }
    .tour-mini-info h4 {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 4px;
      line-height: 1.3;
    }
    .tour-mini-price {
      font-size: 15px;
      font-weight: 700;
      color: var(--vermilion);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .from-tag {
      font-size: 10px;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
    }
    .tour-mini-link {
      font-size: 11px;
      color: var(--indigo);
      font-weight: 600;
      text-decoration: none;
    }
    .tour-mini-link:hover {
      color: var(--vermilion);
    }

    /* Advisors */
    .advisor-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .advisor-item {
      display: flex;
      gap: 12px;
    }
    .advisor-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 16px;
      flex-shrink: 0;
      font-family: var(--font-display);
    }
    .advisor-info h4 {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 2px;
    }
    .advisor-role {
      font-size: 11px;
      color: var(--warm-gold-dark);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      display: block;
      margin-bottom: 4px;
    }
    .advisor-info p {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.4;
    }

    /* Sidebar contact */
    .sidebar-contact .contact-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .contact-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--ink-2);
    }
    a.contact-item {
      text-decoration: none;
      color: var(--indigo);
      font-weight: 500;
    }
    a.contact-item:hover {
      color: var(--vermilion);
    }
    .contact-item svg {
      color: var(--warm-gold-dark);
      flex-shrink: 0;
    }

    /* ===== Flight Deals Detail Page ===== */
    .flight-page-hero {
      padding: 140px 0 80px;
      background: linear-gradient(180deg, var(--indigo-deep) 0%, var(--indigo) 100%);
      color: var(--ivory);
      position: relative;
      overflow: hidden;
    }
    .flight-page-hero::before {
      content: '';
      position: absolute;
      top: -30%;
      left: -10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(201, 169, 97, 0.12) 0%, transparent 70%);
      border-radius: 50%;
    }
    .flight-page-hero .section-header {
      text-align: center;
      max-width: 680px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }
    .flight-page-hero .eyebrow {
      color: var(--warm-gold-light);
    }
    .flight-page-title {
      font-family: var(--font-display);
      font-size: clamp(32px, 5vw, 52px);
      font-weight: 700;
      line-height: 1.2;
      margin: 16px 0;
      color: var(--ivory);
    }
    .flight-page-subtitle {
      font-size: clamp(14px, 2vw, 17px);
      color: rgba(250, 246, 238, 0.7);
      max-width: 540px;
      margin: 0 auto;
      line-height: 1.7;
    }

    .flight-search-section {
      margin-top: -50px;
      position: relative;
      z-index: 10;
    }
    .flight-search-bar {
      background: white;
      border-radius: 16px;
      padding: 20px 24px;
      box-shadow: var(--shadow-lg);
      display: flex;
      gap: 16px;
      align-items: flex-end;
      border: 1px solid var(--border);
    }
    .search-field {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }
    .search-field label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .search-field select,
    .search-field input[type="date"] {
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: var(--font-body);
      background: white;
      color: var(--ink);
      transition: all 0.2s;
    }
    .search-field select:focus,
    .search-field input[type="date"]:focus {
      outline: none;
      border-color: var(--vermilion);
    }
    .passenger-select {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
    }
    .passenger-select button {
      width: 24px;
      height: 24px;
      border: none;
      background: var(--ivory-2);
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      color: var(--ink-2);
    }
    .passenger-select button:hover {
      background: var(--warm-gold-light);
    }
    .passenger-select span {
      font-weight: 600;
      font-size: 14px;
    }
    .search-btn {
      padding: 12px 28px !important;
      white-space: nowrap;
    }

    .flight-page-main {
      padding: 48px 0 100px;
      background: var(--ivory);
    }
    .flight-page-grid {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 32px;
      align-items: start;
    }

    .filter-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 24px;
    }
    .filter-tag {
      padding: 8px 16px;
      border: 1.5px solid var(--border);
      border-radius: 20px;
      background: white;
      color: var(--ink-2);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-tag:hover {
      border-color: var(--warm-gold);
    }
    .filter-tag.active {
      background: var(--indigo);
      border-color: var(--indigo);
      color: var(--ivory);
    }

    .page-tabs {
      margin-bottom: 24px;
    }

    .flight-page-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .flight-page-card {
      background: white;
      border-radius: 14px;
      border: 1px solid var(--border);
      overflow: hidden;
      position: relative;
      transition: all 0.3s ease;
    }
    .flight-page-card.expanded {
      box-shadow: var(--shadow-lg);
    }
    .fpc-main {
      padding: 20px 24px;
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 24px;
      align-items: center;
    }
    .fpc-route {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 16px;
      align-items: center;
    }
    .fpc-city-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .fpc-city-block.align-right {
      align-items: flex-end;
    }
    .fpc-time {
      font-size: 22px;
      font-weight: 700;
      color: var(--ink);
      font-family: var(--font-display);
    }
    .fpc-city {
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-2);
    }
    .fpc-code {
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.05em;
    }
    .fpc-arrow-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      min-width: 80px;
    }
    .fpc-duration {
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
    }
    .fpc-line {
      display: flex;
      align-items: center;
      gap: 2px;
      width: 80px;
    }
    .fpc-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--warm-gold);
    }
    .fpc-line-icon {
      flex: 1;
      height: 1px;
      background: var(--border);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--vermilion);
    }
    .fpc-line-icon svg {
      position: relative;
      z-index: 1;
    }
    .fpc-stops {
      font-size: 10px;
      color: var(--celadon);
      font-weight: 600;
    }

    .fpc-airline {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--ink-2);
      font-weight: 500;
    }
    .fpc-airline-logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--warm-gold-light);
    }

    .fpc-price-block {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }
    .fpc-price-info {
      text-align: right;
    }
    .fpc-from {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-right: 4px;
    }
    .fpc-price {
      font-size: 24px;
      font-weight: 700;
      color: var(--vermilion);
      font-family: var(--font-display);
    }
    .fpc-original {
      display: block;
      font-size: 13px;
      color: var(--muted);
      text-decoration: line-through;
      text-align: right;
      margin-top: 2px;
    }
    .fpc-select-btn {
      min-width: 100px;
    }
    .fpc-expand-btn {
      background: none;
      border: none;
      color: var(--indigo);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
    }
    .fpc-expand-btn:hover {
      color: var(--vermilion);
    }
    .fpc-expand-btn svg {
      transition: transform 0.3s;
    }
    .fpc-expand-btn svg.rotate-up {
      transform: rotate(180deg);
    }
    .fpc-deal-tag {
      position: absolute;
      top: 16px;
      left: 24px;
      background: var(--vermilion);
      color: var(--ivory);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 4px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .fpc-expanded {
      background: var(--ivory-2);
      border-top: 1px solid var(--border);
      padding: 16px 24px;
    }
    .fpc-expanded-header {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .fpc-extra-time {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 20px;
      align-items: center;
      padding: 12px 16px;
      background: white;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .fpc-route-small {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .fpc-time-small {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
    }
    .fpc-line-small {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 80px;
    }
    .fpc-dot-small {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--warm-gold);
    }
    .fpc-dur-small {
      font-size: 10px;
      color: var(--muted);
      white-space: nowrap;
    }
    .fpc-price-small {
      font-size: 16px;
      font-weight: 700;
      color: var(--vermilion);
      font-family: var(--font-display);
    }

    .no-results {
      padding: 60px 20px;
      text-align: center;
      color: var(--muted);
    }

    /* Flight sidebar */
    .flight-sidebar {
      display: flex;
      flex-direction: column;
      gap: 24px;
      position: sticky;
      top: 92px;
    }

    .price-trend-chart {
      margin-bottom: 16px;
    }
    .trend-svg {
      width: 100%;
      height: 120px;
    }
    .trend-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }
    .trend-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .trend-stat {
      text-align: center;
      padding: 12px;
      background: var(--ivory-2);
      border-radius: 8px;
    }
    .trend-stat-label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .trend-stat-value {
      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
      font-family: var(--font-display);
    }
    .trend-stat-value.highlight {
      color: var(--vermilion);
    }

    .tips-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .tips-list li {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 13px;
      color: var(--ink-2);
      line-height: 1.5;
    }
    .tip-icon {
      color: var(--warm-gold-dark);
      flex-shrink: 0;
      margin-top: 2px;
    }

    .sidebar-alert .alert-desc {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .alert-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .alert-form input {
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      font-family: var(--font-body);
    }
    .alert-form input:focus {
      outline: none;
      border-color: var(--vermilion);
    }
    .alert-form button {
      padding: 10px 16px;
      border-radius: 8px;
    }

    /* ===== Digital Human Advisor ===== */
    .dh-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 24, 64, 0.4);
      z-index: 9998;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .dh-overlay {
      opacity: 1;
      pointer-events: auto;
    }
    @media (min-width: 769px) {
      .dh-overlay {
        display: none;
      }
    }

    .dh-fab-wrapper {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.3s ease;
    }
    .dh-fab-wrapper.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(20px);
    }

    .dh-bubble {
      background: white;
      color: var(--ink);
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: var(--shadow-lg);
      white-space: nowrap;
      position: relative;
      animation: bubbleIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      border: 1px solid var(--border);
    }
    .dh-bubble-arrow {
      position: absolute;
      right: -6px;
      top: 50%;
      transform: translateY(-50%) rotate(45deg);
      width: 10px;
      height: 10px;
      background: white;
      border-right: 1px solid var(--border);
      border-top: 1px solid var(--border);
    }
    @keyframes bubbleIn {
      from { opacity: 0; transform: translateX(10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .dh-fab {
      position: relative;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: var(--vermilion);
      box-shadow: 0 6px 24px rgba(184, 52, 46, 0.4);
      transition: all 0.3s ease;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dh-fab:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 32px rgba(184, 52, 46, 0.5);
    }
    .dh-fab:active {
      transform: scale(0.95);
    }
    .dh-fab-inner {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      overflow: hidden;
      background: linear-gradient(135deg, var(--vermilion), var(--vermilion-light));
    }
    .dh-fab-pulse {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 2px solid var(--vermilion);
      animation: dhPulse 2s ease-out infinite;
      pointer-events: none;
    }
    @keyframes dhPulse {
      0% { transform: scale(1); opacity: 0.7; }
      100% { transform: scale(1.3); opacity: 0; }
    }

    /* Chat panel */
    .dh-chat-panel {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 380px;
      max-width: calc(100vw - 48px);
      height: 560px;
      max-height: calc(100vh - 48px);
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(30, 42, 94, 0.2);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: translateY(20px) scale(0.95);
      opacity: 0;
      pointer-events: none;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      border: 1px solid var(--border);
    }
    .dh-chat-panel.open {
      transform: translateY(0) scale(1);
      opacity: 1;
      pointer-events: auto;
    }

    /* Panel header */
    .dh-chat-header {
      padding: 16px 20px;
      background: linear-gradient(135deg, var(--indigo-deep), var(--indigo));
      color: var(--ivory);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }
    .dh-chat-header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--warm-gold), var(--vermilion), var(--warm-gold));
      opacity: 0.7;
    }
    .dh-header-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .dh-header-avatar {
      position: relative;
      width: 40px;
      height: 40px;
    }
    .dh-online-dot {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 10px;
      height: 10px;
      background: var(--celadon);
      border: 2px solid var(--indigo-deep);
      border-radius: 50%;
    }
    .dh-header-text .dh-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--ivory);
    }
    .dh-header-text .dh-role {
      font-size: 12px;
      color: var(--warm-gold-light);
      font-weight: 400;
    }
    .dh-header-text .dh-status {
      font-size: 11px;
      color: rgba(250, 246, 238, 0.7);
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 2px;
    }
    .dh-status-dot {
      width: 6px;
      height: 6px;
      background: var(--celadon);
      border-radius: 50%;
      animation: statusPulse 2s ease-in-out infinite;
    }
    @keyframes statusPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .dh-close-btn {
      background: none;
      border: none;
      color: rgba(250, 246, 238, 0.7);
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dh-close-btn:hover {
      color: var(--ivory);
      background: rgba(250, 246, 238, 0.1);
    }

    /* Chat body */
    .dh-chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: var(--ivory);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .dh-chat-body::-webkit-scrollbar {
      width: 4px;
    }
    .dh-chat-body::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px;
    }

    .chat-msg {
      display: flex;
      gap: 10px;
      max-width: 85%;
      animation: msgIn 0.3s ease;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .chat-msg.user-msg {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .msg-avatar {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
    }
    .msg-content {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .msg-bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 13px;
      line-height: 1.55;
      word-break: break-word;
    }
    .user-msg .msg-bubble {
      background: var(--vermilion);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .bot-bubble {
      background: white;
      color: var(--ink);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .bot-bubble strong {
      color: var(--indigo);
      font-weight: 700;
    }
    .msg-link-btn {
      align-self: flex-start;
      background: none;
      border: none;
      color: var(--vermilion);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      padding: 2px 4px;
      text-align: left;
    }
    .msg-link-btn:hover {
      text-decoration: underline;
    }

    /* Typing indicator */
    .typing-bubble {
      padding: 12px 14px;
    }
    .typing-dots {
      display: flex;
      gap: 5px;
      align-items: center;
    }
    .typing-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      animation: typingBounce 1.4s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    /* Quick questions */
    .dh-quick-questions {
      padding: 12px 16px;
      background: white;
      border-top: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .quick-question-btn {
      padding: 6px 12px;
      border: 1.5px solid var(--warm-gold);
      border-radius: 20px;
      background: var(--ivory);
      color: var(--indigo);
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      white-space: normal;
      text-align: left;
      line-height: 1.3;
    }
    .quick-question-btn:hover {
      background: var(--warm-gold);
      color: white;
      transform: translateY(-1px);
    }

    /* Chat input */
    .dh-chat-input {
      padding: 12px 16px;
      background: white;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .dh-chat-input input {
      flex: 1;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 20px;
      font-size: 13px;
      font-family: var(--font-body);
      outline: none;
      transition: all 0.2s;
    }
    .dh-chat-input input:focus {
      border-color: var(--vermilion);
    }
    .dh-send-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: var(--vermilion);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .dh-send-btn:hover:not(:disabled) {
      background: var(--vermilion-dark);
      transform: scale(1.08);
    }
    .dh-send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Avatar animation */
    .digital-avatar {
      border-radius: 50%;
      overflow: hidden;
      transition: transform 0.3s ease;
    }
    .digital-avatar.speaking {
      animation: avatarBob 1.2s ease-in-out infinite;
    }
    @keyframes avatarBob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-1px) rotate(-1deg); }
      75% { transform: translateY(-1px) rotate(1deg); }
    }
    .digital-avatar.speaking .dh-mouth {
      animation: mouthMove 0.4s ease-in-out infinite;
    }
    @keyframes mouthMove {
      0%, 100% { d: path("M 28 42 Q 32 45 36 42"); stroke-width: 1.5; }
      50% { stroke-width: 2.5; }
    }

    /* Mobile */
    @media (max-width: 480px) {
      .dh-chat-panel {
        bottom: 0;
        right: 0;
        left: 0;
        width: 100%;
        max-width: 100%;
        height: 85vh;
        max-height: 85vh;
        border-radius: 20px 20px 0 0;
        transform: translateY(100%);
      }
      .dh-chat-panel.open {
        transform: translateY(0);
      }
      .dh-fab-wrapper {
        bottom: 16px;
        right: 16px;
      }
      .dh-fab {
        width: 56px;
        height: 56px;
      }
      .dh-fab-inner {
        width: 48px;
        height: 48px;
      }
      .dh-bubble {
        display: none;
      }
    }

    /* ===== Visa Free Page ===== */
    .visa-free-page { padding-top: 72px; }

    .vf-hero {
      position: relative;
      overflow: hidden;
      padding: 100px 0 80px;
    }
    .vf-hero-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
    }
    .vf-hero-map { width: 100%; height: 100%; }
    .vf-hero-content {
      position: relative;
      z-index: 1;
      text-align: center;
      color: var(--ivory);
    }
    .vf-eyebrow {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(201, 169, 97, 0.2);
      border: 1px solid rgba(201, 169, 97, 0.4);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: var(--warm-gold);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .vf-hero-title {
      font-family: var(--font-heading);
      font-size: 56px;
      font-weight: 700;
      line-height: 1.15;
      margin: 0 0 20px;
      color: var(--ivory);
    }
    .vf-hero-subtitle {
      font-size: 18px;
      line-height: 1.7;
      max-width: 680px;
      margin: 0 auto 40px;
      color: rgba(250, 246, 238, 0.8);
    }
    .vf-hero-stats {
      display: flex;
      justify-content: center;
      gap: 48px;
      flex-wrap: wrap;
    }
    .vf-stat {
      text-align: center;
    }
    .vf-stat-num {
      display: block;
      font-family: var(--font-heading);
      font-size: 48px;
      font-weight: 700;
      color: var(--warm-gold);
      line-height: 1;
    }
    .vf-stat-label {
      display: block;
      font-size: 13px;
      color: rgba(250, 246, 238, 0.7);
      margin-top: 8px;
    }

    /* Checker */
    .vf-checker-section {
      padding: 60px 0;
      background: var(--ivory);
      margin-top: -40px;
      position: relative;
      z-index: 2;
    }
    .vf-checker-card {
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 10px 40px rgba(30, 42, 94, 0.1);
      border: 1px solid var(--border);
    }
    .vf-checker-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .vf-checker-header h2 {
      font-family: var(--font-heading);
      font-size: 28px;
      margin: 0 0 8px;
      color: var(--indigo-deep);
    }
    .vf-checker-header p {
      color: var(--muted);
      margin: 0;
    }
    .vf-checker-form {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 16px;
      align-items: end;
    }
    .vf-form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 8px;
    }
    .vf-form-group select {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-family: var(--font-body);
      background: white;
      color: var(--ink);
      outline: none;
      transition: border-color 0.2s;
      cursor: pointer;
    }
    .vf-form-group select:focus {
      border-color: var(--vermilion);
    }
    .vf-check-btn {
      white-space: nowrap;
    }
    .vf-checker-result {
      margin-top: 24px;
      padding: 24px;
      border-radius: 12px;
      text-align: center;
      animation: fadeSlideUp 0.4s ease;
    }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .vf-result-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      margin: 0 auto 12px;
      color: white;
    }
    .vf-result-yes { background: rgba(76, 175, 80, 0.1); border: 1px solid rgba(76, 175, 80, 0.3); }
    .vf-result-yes .vf-result-icon { background: #4CAF50; }
    .vf-result-yes h3 { color: #2E7D32; }
    .vf-result-partial { background: rgba(255, 152, 0, 0.1); border: 1px solid rgba(255, 152, 0, 0.3); }
    .vf-result-partial .vf-result-icon { background: #FF9800; }
    .vf-result-partial h3 { color: #E65100; }
    .vf-result-no { background: rgba(184, 52, 46, 0.08); border: 1px solid rgba(184, 52, 46, 0.2); }
    .vf-result-no .vf-result-icon { background: var(--vermilion); }
    .vf-result-no h3 { color: var(--vermilion); }
    .vf-checker-result h3 {
      font-family: var(--font-heading);
      font-size: 20px;
      margin: 0 0 6px;
    }
    .vf-checker-result p {
      margin: 4px 0;
      color: var(--ink);
      font-size: 14px;
    }
    .vf-result-note {
      font-size: 12px !important;
      color: var(--muted) !important;
      margin-top: 8px !important;
    }

    /* Sections */
    .vf-what-section, .vf-countries-section, .vf-ports-section, .vf-process-section,
    .vf-notes-section, .vf-itin-section, .vf-faq-section, .vf-cta-section {
      padding: 80px 0;
    }
    .vf-section-head {
      text-align: center;
      margin-bottom: 48px;
    }
    .vf-section-eyebrow {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--vermilion);
      margin-bottom: 12px;
    }
    .vf-section-title {
      font-family: var(--font-heading);
      font-size: 40px;
      font-weight: 700;
      color: var(--indigo-deep);
