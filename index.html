      margin: 0 0 12px;
    }
    .vf-section-sub {
      color: var(--muted);
      max-width: 600px;
      margin: 0 auto;
      font-size: 16px;
    }

    .vf-section-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
    }
    .vf-section-text p {
      color: var(--muted);
      line-height: 1.8;
      margin: 16px 0 24px;
    }
    .vf-what-points {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .vf-what-points li {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 0;
      color: var(--ink);
      font-size: 15px;
    }
    .vf-check-mark {
      color: var(--celadon);
      font-weight: 700;
      font-size: 16px;
      flex-shrink: 0;
    }

    .vf-passport-card {
      background: linear-gradient(135deg, var(--indigo-deep), var(--indigo));
      border-radius: 16px;
      padding: 28px;
      color: var(--ivory);
      box-shadow: 0 20px 60px rgba(30, 42, 94, 0.3);
    }
    .vf-passport-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(250, 246, 238, 0.15);
      margin-bottom: 20px;
    }
    .vf-passport-type {
      font-size: 14px;
      font-weight: 700;
      color: var(--warm-gold);
    }
    .vf-passport-sub {
      font-size: 11px;
      color: rgba(250, 246, 238, 0.6);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .vf-passport-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid rgba(250, 246, 238, 0.08);
    }
    .vf-passport-row:last-child { border-bottom: none; }
    .vf-passport-row span {
      font-size: 13px;
      color: rgba(250, 246, 238, 0.6);
    }
    .vf-passport-row strong {
      font-size: 14px;
      color: var(--ivory);
    }

    /* Countries */
    .vf-countries-section { background: var(--ivory); }
    .vf-countries-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 32px;
    }
    .vf-country-group h3 {
      font-family: var(--font-heading);
      font-size: 18px;
      color: var(--indigo-deep);
      margin: 0 0 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--warm-gold);
      display: inline-block;
    }
    .vf-country-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .vf-country-tag {
      padding: 6px 14px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 13px;
      color: var(--ink);
      transition: all 0.2s;
    }
    .vf-country-tag:hover {
      border-color: var(--vermilion);
      color: var(--vermilion);
      transform: translateY(-1px);
    }

    /* Ports */
    .vf-ports-map-wrap {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 30px rgba(30, 42, 94, 0.08);
      border: 1px solid var(--border);
      margin-bottom: 32px;
    }
    .vf-ports-map { width: 100%; height: auto; }
    .vf-ports-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .vf-port-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 24px;
      font-size: 13px;
      color: var(--ink);
    }
    .vf-port-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--vermilion);
    }
    .vf-port-more {
      background: var(--warm-gold-light);
      border-color: var(--warm-gold);
      color: var(--indigo-deep);
      font-weight: 600;
    }

    /* Process */
    .vf-process-section { background: var(--ivory); }
    .vf-process-steps {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
      position: relative;
    }
    .vf-step {
      background: white;
      border-radius: 16px;
      padding: 32px 24px 28px;
      text-align: center;
      border: 1px solid var(--border);
      position: relative;
      transition: all 0.3s;
    }
    .vf-step:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(30, 42, 94, 0.1);
      border-color: var(--warm-gold);
    }
    .vf-step-num {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--vermilion), var(--vermilion-light));
      color: white;
      font-family: var(--font-heading);
      font-size: 22px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }
    .vf-step h3 {
      font-family: var(--font-heading);
      font-size: 17px;
      color: var(--indigo-deep);
      margin: 0 0 8px;
    }
    .vf-step p {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
      margin: 0;
    }

    /* Notes */
    .vf-notes-card {
      background: linear-gradient(135deg, #FFF8E7, #FFEFE0);
      border-radius: 16px;
      padding: 40px;
      display: flex;
      gap: 28px;
      border: 1px solid rgba(201, 169, 97, 0.3);
    }
    .vf-notes-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--warm-gold);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .vf-notes-content h2 {
      font-family: var(--font-heading);
      font-size: 24px;
      color: var(--indigo-deep);
      margin: 0 0 16px;
    }
    .vf-notes-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 24px;
    }
    .vf-notes-list li {
      position: relative;
      padding-left: 24px;
      font-size: 14px;
      color: var(--ink);
      line-height: 1.5;
    }
    .vf-notes-list li::before {
      content: '!';
      position: absolute;
      left: 0;
      top: 2px;
      width: 16px;
      height: 16px;
      background: var(--vermilion);
      color: white;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Itineraries */
    .vf-itin-section { background: var(--ivory); }
    .vf-itin-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }
    .vf-itin-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      transition: all 0.3s;
    }
    .vf-itin-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 40px rgba(30, 42, 94, 0.12);
    }
    .vf-itin-cover {
      height: 140px;
      position: relative;
      display: flex;
      align-items: flex-end;
      padding: 16px;
    }
    .vf-itin-cover-0 { background: linear-gradient(135deg, #B8342E, #D4544E); }
    .vf-itin-cover-1 { background: linear-gradient(135deg, #2E7D32, #66BB6A); }
    .vf-itin-cover-2 { background: linear-gradient(135deg, #1565C0, #42A5F5); }
    .vf-itin-cover-3 { background: linear-gradient(135deg, #6A1B9A, #AB47BC); }
    .vf-itin-days {
      background: rgba(0,0,0,0.3);
      color: white;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      backdrop-filter: blur(4px);
    }
    .vf-itin-body { padding: 20px; }
    .vf-itin-title {
      font-family: var(--font-heading);
      font-size: 16px;
      color: var(--indigo-deep);
      margin: 0 0 12px;
      line-height: 1.4;
    }
    .vf-itin-cities {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }
    .vf-itin-city {
      padding: 3px 10px;
      background: var(--ivory);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 11px;
      color: var(--muted);
    }
    .vf-itin-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .vf-itin-audience {
      font-size: 11px;
      color: var(--muted);
    }
    .vf-itin-price {
      font-size: 14px;
      font-weight: 700;
      color: var(--vermilion);
    }
    .vf-itin-btn { width: 100%; justify-content: center; }

    /* FAQ */
    .vf-faq-list {
      max-width: 800px;
      margin: 0 auto;
    }
    .vf-faq-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 12px;
      background: white;
      overflow: hidden;
      transition: all 0.2s;
    }
    .vf-faq-item.open {
      border-color: var(--warm-gold);
      box-shadow: 0 4px 16px rgba(201, 169, 97, 0.15);
    }
    .vf-faq-q {
      width: 100%;
      padding: 20px 24px;
      background: none;
      border: none;
      text-align: left;
      font-size: 16px;
      font-weight: 600;
      color: var(--indigo-deep);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      font-family: var(--font-body);
    }
    .vf-faq-icon {
      font-size: 20px;
      color: var(--vermilion);
      font-weight: 300;
      flex-shrink: 0;
    }
    .vf-faq-a {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease, padding 0.3s ease;
    }
    .vf-faq-item.open .vf-faq-a {
      max-height: 300px;
      padding: 0 24px 20px;
    }
    .vf-faq-a p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    /* CTA */
    .vf-cta-section { padding: 80px 0; }
    .vf-cta-card {
      background: linear-gradient(135deg, var(--indigo-deep), var(--indigo));
      border-radius: 20px;
      padding: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 40px;
      position: relative;
      overflow: hidden;
    }
    .vf-cta-card::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -10%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(201, 169, 97, 0.15) 0%, transparent 70%);
    }
    .vf-cta-text h2 {
      font-family: var(--font-heading);
      font-size: 32px;
      color: var(--ivory);
      margin: 0 0 10px;
    }
    .vf-cta-text p {
      color: rgba(250, 246, 238, 0.7);
      margin: 0;
      font-size: 16px;
    }

    /* ===== Blog Page ===== */
    .blog-page { padding-top: 72px; }

    .blog-hero {
      background: linear-gradient(135deg, var(--indigo-deep) 0%, var(--indigo) 100%);
      padding: 80px 0 70px;
      text-align: center;
      color: var(--ivory);
      position: relative;
      overflow: hidden;
    }
    .blog-hero::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(184, 52, 46, 0.2) 0%, transparent 60%);
    }
    .blog-hero::after {
      content: '';
      position: absolute;
      bottom: -50%;
      right: -10%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(201, 169, 97, 0.15) 0%, transparent 60%);
    }
    .blog-hero-eyebrow {
      display: inline-block;
      padding: 6px 16px;
      background: rgba(201, 169, 97, 0.2);
      border: 1px solid rgba(201, 169, 97, 0.4);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: var(--warm-gold);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 20px;
      position: relative;
    }
    .blog-hero-title {
      font-family: var(--font-heading);
      font-size: 48px;
      font-weight: 700;
      margin: 0 0 16px;
      position: relative;
    }
    .blog-hero-sub {
      font-size: 17px;
      color: rgba(250, 246, 238, 0.75);
      max-width: 600px;
      margin: 0 auto;
      position: relative;
    }

    .blog-content {
      padding: 60px 0;
      background: var(--ivory);
    }
    .blog-layout {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 48px;
    }

    /* Toolbar */
    .blog-toolbar {
      margin-bottom: 36px;
    }
    .blog-search {
      position: relative;
      margin-bottom: 20px;
    }
    .blog-search svg {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
    }
    .blog-search input {
      width: 100%;
      padding: 14px 16px 14px 48px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      font-family: var(--font-body);
      background: white;
      outline: none;
      transition: all 0.2s;
    }
    .blog-search input:focus {
      border-color: var(--vermilion);
      box-shadow: 0 0 0 3px rgba(184, 52, 46, 0.1);
    }
    .blog-categories {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .blog-cat-btn {
      padding: 8px 16px;
      border: 1.5px solid var(--border);
      border-radius: 20px;
      background: white;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: var(--font-body);
    }
    .blog-cat-btn:hover {
      border-color: var(--vermilion);
      color: var(--vermilion);
    }
    .blog-cat-btn.active {
      background: var(--vermilion);
      border-color: var(--vermilion);
      color: white;
    }

    /* Featured */
    .blog-featured {
      margin-bottom: 40px;
    }
    .blog-featured-link {
      text-decoration: none;
      color: inherit;
    }
    .blog-featured { background: white; border-radius: 16px; overflow: hidden; border: 1px solid var(--border); transition: all 0.3s; }
    .blog-featured:hover { box-shadow: 0 12px 40px rgba(30, 42, 94, 0.1); transform: translateY(-2px); }
    .blog-featured { display: grid; grid-template-columns: 1fr 1fr; }
    .blog-featured-cover {
      min-height: 320px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }
    .blog-featured-badge {
      align-self: flex-start;
      background: var(--warm-gold);
      color: white;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .blog-featured-body { padding: 32px; }
    .blog-featured-title {
      font-family: var(--font-heading);
      font-size: 28px;
      font-weight: 700;
      color: var(--indigo-deep);
      margin: 12px 0 16px;
      line-height: 1.3;
    }
    .blog-featured-excerpt {
      color: var(--muted);
      line-height: 1.7;
      margin: 0 0 20px;
      font-size: 15px;
    }
    .blog-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .blog-meta.small { font-size: 12px; margin-bottom: 12px; }
    .blog-dot { opacity: 0.4; }
    .blog-read-more {
      color: var(--vermilion);
      font-weight: 600;
      font-size: 14px;
    }

    /* Cover gradients */
    .blog-cover-0 { background: linear-gradient(135deg, #B8342E, #D4544E, #C9A961); }
    .blog-cover-1 { background: linear-gradient(135deg, #1E2A5E, #2E4080, #1565C0); }
    .blog-cover-2 { background: linear-gradient(135deg, #2E7D32, #66BB6A, #C9A961); }
    .blog-cover-3 { background: linear-gradient(135deg, #6A1B9A, #AB47BC, #D4544E); }
    .blog-cover-4 { background: linear-gradient(135deg, #E65100, #FF9800, #C9A961); }
    .blog-cover-5 { background: linear-gradient(135deg, #00695C, #26A69A, #66BB6A); }
    .blog-cover-6 { background: linear-gradient(135deg, #4527A0, #7E57C2, #B8342E); }
    .blog-cover-7 { background: linear-gradient(135deg, #00838F, #26C6DA, #1565C0); }

    /* Article grid */
    .blog-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }
    .blog-card {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      transition: all 0.3s;
    }
    .blog-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(30, 42, 94, 0.1);
    }
    .blog-card a { text-decoration: none; color: inherit; display: block; }
    .blog-card-cover {
      height: 180px;
      position: relative;
      padding: 16px;
      display: flex;
      align-items: flex-start;
    }
    .blog-tag {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(250, 246, 238, 0.95);
      color: var(--vermilion);
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
      backdrop-filter: blur(4px);
    }
    .blog-tag.large {
      padding: 6px 16px;
      font-size: 13px;
      margin-bottom: 16px;
    }
    .blog-card-body { padding: 20px; }
    .blog-card-title {
      font-family: var(--font-heading);
      font-size: 17px;
      font-weight: 700;
      color: var(--indigo-deep);
      margin: 0 0 10px;
      line-height: 1.4;
    }
    .blog-card-excerpt {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
      margin: 0 0 14px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .blog-card-author {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }
    .blog-author-avatar-mini {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--warm-gold), var(--vermilion));
      color: white;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .blog-empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    /* Pagination */
    .blog-pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 48px;
    }
    .blog-page-btn {
      padding: 10px 20px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: white;
      color: var(--ink);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: var(--font-body);
    }
    .blog-page-btn:hover:not(:disabled) {
      border-color: var(--vermilion);
      color: var(--vermilion);
    }
    .blog-page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .blog-page-nums { display: flex; gap: 6px; }
    .blog-page-num {
      width: 38px;
      height: 38px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      background: white;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: var(--font-body);
    }
    .blog-page-num.active {
      background: var(--vermilion);
      border-color: var(--vermilion);
      color: white;
    }
    .blog-page-num:hover:not(.active) {
      border-color: var(--vermilion);
      color: var(--vermilion);
    }

    /* Sidebar */
    .blog-sidebar {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .blog-side-widget {
      background: white;
      border-radius: 14px;
      padding: 24px;
      border: 1px solid var(--border);
    }
    .blog-side-title {
      font-family: var(--font-heading);
      font-size: 16px;
      color: var(--indigo-deep);
      margin: 0 0 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--warm-gold);
      display: inline-block;
    }
    .blog-popular-list {
      list-style: none;
      padding: 0;
      margin: 0;
      counter-reset: pop;
    }
    .blog-popular-list li {
      counter-increment: pop;
      border-bottom: 1px solid var(--border);
      padding: 12px 0;
    }
    .blog-popular-list li:last-child { border-bottom: none; }
    .blog-popular-list a {
      display: flex;
      gap: 14px;
      text-decoration: none;
      color: inherit;
    }
    .blog-pop-rank {
      font-family: var(--font-heading);
      font-size: 24px;
      font-weight: 700;
      color: var(--border);
      line-height: 1;
      flex-shrink: 0;
    }
    .blog-popular-list li:nth-child(-n+3) .blog-pop-rank { color: var(--vermilion); }
    .blog-pop-info { flex: 1; min-width: 0; }
    .blog-pop-cat {
      font-size: 11px;
      color: var(--vermilion);
      font-weight: 600;
      margin-bottom: 4px;
      display: block;
    }
    .blog-pop-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      margin: 0;
      line-height: 1.4;
    }

    .blog-newsletter-widget p {
      font-size: 13px;
      color: var(--muted);
      margin: 0 0 14px;
      line-height: 1.6;
    }
    .blog-newsletter-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .blog-newsletter-form input {
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      font-family: var(--font-body);
      outline: none;
    }
    .blog-newsletter-form input:focus { border-color: var(--vermilion); }
    .blog-newsletter-form .btn { width: 100%; justify-content: center; }

    .blog-social-row {
      display: flex;
      gap: 10px;
    }
    .blog-social-btn {
      flex: 1;
      height: 42px;
      border-radius: 10px;
      background: var(--ivory);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--indigo);
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .blog-social-btn:hover {
      background: var(--vermilion);
      color: white;
      border-color: var(--vermilion);
    }

    /* ===== Blog Article Page ===== */
    .blog-article-page { padding-top: 72px; background: white; }

    .blog-article-cover {
      padding: 80px 0 60px;
      color: var(--ivory);
      position: relative;
    }
    .blog-article-cover-inner {
      position: relative;
      z-index: 1;
      max-width: 760px;
    }
    .blog-back-link {
      color: rgba(250, 246, 238, 0.8);
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 24px;
      display: inline-block;
      transition: color 0.2s;
    }
    .blog-back-link:hover { color: var(--warm-gold); }
    .blog-article-title {
      font-family: var(--font-heading);
      font-size: 42px;
      font-weight: 700;
      line-height: 1.25;
      margin: 16px 0 24px;
      color: var(--ivory);
    }
    .blog-article-meta { margin-top: 20px; }
    .blog-article-author {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .blog-author-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--warm-gold);
      color: var(--indigo-deep);
      font-family: var(--font-heading);
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .blog-author-name {
      font-weight: 600;
      font-size: 15px;
    }
    .blog-author-date {
      font-size: 12px;
      color: rgba(250, 246, 238, 0.7);
      margin-top: 4px;
    }

    .blog-article-body {
      max-width: 760px;
      margin: 0 auto;
      padding: 60px 0;
    }
    .blog-article-content h2 {
      font-family: var(--font-heading);
      font-size: 28px;
      font-weight: 700;
      color: var(--indigo-deep);
      margin: 48px 0 16px;
    }
    .blog-article-content h3 {
      font-family: var(--font-heading);
      font-size: 20px;
      font-weight: 700;
      color: var(--indigo-deep);
      margin: 32px 0 12px;
    }

      letter-spacing: 1px;
      margin: 0 0 4px;

      font-size: 20px;
      color: var(--indigo-deep);
      margin: 0 0 8px;
    }
    .blog-author-card p {
      font-size: 14px;
      color: var(--muted);

    /* Related */

      border-top: 1px solid var(--border);
    }
    .blog-related h2 {

      color: var(--indigo-deep);
      margin: 0 0 24px;
    }
    .blog-related-grid {

      padding-top: 48px;
      border-top: 1px solid var(--border);

      margin-bottom: 32px;

      font-size: 14px;

    }
    .blog-comment-avatar {

      height: 40px;

      align-items: center;
      justify-content: center;

      padding: 2px 8px;
      background: var(--ivory);
      border-radius: 10px;
      color: var(--muted);

    .blog-comment-body p { margin: 0; font-size: 14px; line-height: 1.7; color: #333; }



    /* ===== BlogCover Component ===== */
    .blog-cover {
      position: relative;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }
    .blog-cover-illustration {
      position: absolute;

      height: 100%;

    }
    .blog-cover-overlay {
      position: absolute;

      background: linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(0,0,0,0.25) 100%);

      position: relative;
      z-index: 2;

      flex-direction: column;
      justify-content: space-between;

    .blog2-featured-badge {

      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;

    /* Article cover text adjustments */

    .blog2-article-inner {

    .blog2-back-link {

    /* Inline article image */

    /* ====== Visa Free Page V2 ====== */
    .visa-free-page.v2 { padding-top: 72px; }

    .vf2-hero {

    .vf2-section-title {
      font-family: var(--font-heading);

    .vf2-stat-card {

      -webkit-text-fill-color: transparent;

    .vf2-stat-label {
      display: block;
      font-size: 18px;

      font-size: 13px;
      color: var(--muted);
      margin: 0;
      line-height: 1.5;
    }

    /* Compare table */
    .vf2-compare {
      background: white;
      border-radius: 16px;
      padding: 36px;
      border: 1px solid var(--border);
    }
    .vf2-compare-title {
      font-family: var(--font-heading);
      font-size: 24px;
      color: var(--indigo-deep);
      margin: 0 0 6px;
      text-align: center;
    }
    .vf2-compare-sub {
      text-align: center;
      color: var(--muted);
      margin: 0 0 24px;
      font-size: 14px;
    }
    .vf2-compare-table {
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .vf2-compare-row {
      display: grid;
      grid-template-columns: 1fr 1.2fr 1.2fr;
    }
    .vf2-compare-row.head .vf2-compare-cell {
      background: var(--indigo-deep);
      color: var(--ivory);
      font-weight: 600;
      padding: 14px 20px;

      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);

      font-weight: 600;
      color: var(--indigo-deep);
      background: var(--ivory);
    }
    .vf2-compare-cell.a { color: var(--ink); }
    .vf2-compare-cell.b {
      color: var(--ink);
      background: rgba(201, 169, 97, 0.06);
      font-weight: 500;
    }
    .vf2-compare-row.head .vf2-compare-cell.b {
      background: var(--vermilion);
      color: white;
    }

    /* Eligibility checker */
    .vf-checker-section { padding: 0 0 80px; margin-top: -60px; position: relative; z-index: 10; }
    .vf-checker-card {
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 10px 40px rgba(30, 42, 94, 0.12);
      border: 1px solid var(--border);
    }
    .vf-checker-header { text-align: center; margin-bottom: 28px; }

      font-family: var(--font-heading);
      font-size: 26px;
      margin: 8px 0 8px;
      color: var(--indigo-deep);
    }
    .vf-checker-header p { color: var(--muted); margin: 0; font-size: 15px; }
    .vf-checker-form {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 16px;
      align-items: end;
    }
    .vf-form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 8px;
    }
    .vf-form-group select {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 14px;

      background: white;
      color: var(--ink);
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;

    .vf-result-icon {
      width: 48px; height: 48px;

    .vf-result-note { font-size: 12px !important; color: var(--muted) !important; margin-top: 8px !important; }

      font-family: var(--font-heading);

      color: var(--indigo-deep);
      margin: 0 0 16px;

    .vf2-provinces { margin-bottom: 40px; }
    .vf2-province-grid {

    .vf2-province-chip {

    .vf2-port-types {

    /* Process section */

    .vf2-process-layout {

      grid-template-columns: 1fr 1fr;
      gap: 40px;

    .vf2-cond-icon {

      height: 36px;
      border-radius: 50%;

      font-weight: 600;
      color: var(--indigo-deep);

    .vf2-cond-item p {
      margin: 0;
      font-size: 13px;
      color: var(--muted);

    .vf2-step-list {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .vf2-step-item {
      display: flex;
      gap: 20px;
      position: relative;
    }
    .vf2-step-num {

      height: 44px;

      color: var(--warm-gold);

      font-weight: 600;
      color: var(--indigo-deep);

    .vf2-step-body p {
      margin: 0;
      font-size: 13px;
      color: var(--muted);

    .vf2-step-line {

    .vf2-notes-card {

    .vf2-notes-icon {

      height: 48px;

      background: var(--warm-gold);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;

    .vf2-notes-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 24px;
    }
    .vf2-notes-list li {
      position: relative;
      padding-left: 22px;
      font-size: 14px;
      color: var(--ink);
      line-height: 1.5;
    }
    .vf2-notes-list li::before {
      content: '!';
      position: absolute;
      left: 0; top: 2px;
      width: 16px; height: 16px;
      background: var(--vermilion);
      color: white;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Itineraries */
    .vf2-itin-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }
    .vf2-itin-card {
      background: white;
      border-radius: 16px;

      border: 1px solid var(--border);
      transition: all 0.3s;
      display: flex;
      flex-direction: column;
    }
    .vf2-itin-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 48px rgba(30, 42, 94, 0.14);
    }
    .vf2-itin-cover {
      height: 120px;
      padding: 16px;
      position: relative;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: space-between;

    .vf2-itin-cover-0 { background: linear-gradient(135deg, #B8342E, #D4544E, #C9A961); }
    .vf2-itin-cover-1 { background: linear-gradient(135deg, #2E7D32, #66BB6A, #C9A961); }
    .vf2-itin-cover-2 { background: linear-gradient(135deg, #1565C0, #42A5F5, #B8342E); }
    .vf2-itin-cover-3 { background: linear-gradient(135deg, #6A1B9A, #AB47BC, #C9A961); }
    .vf2-itin-route {

      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      flex-wrap: wrap;

    .vf2-itin-arrow { opacity: 0.7; }
    .vf2-itin-days {
      align-self: flex-start;
      padding: 4px 12px;
      background: rgba(0,0,0,0.25);
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      backdrop-filter: blur(4px);

    .vf2-itin-body {
      padding: 18px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .vf2-itin-title {
      font-family: var(--font-heading);
      font-size: 16px;
      font-weight: 700;
      color: var(--indigo-deep);
      margin: 0 0 12px;
      line-height: 1.4;

    .vf2-itin-highlights-label {

      color: var(--muted);

    .vf2-itin-highlights {
      display: flex;

      gap: 6px;

    }
    .vf2-itin-tag {

      background: var(--ivory);

      font-size: 11px;
      color: var(--muted);

    .vf2-itin-footer {
      margin-top: auto;

      justify-content: space-between;
      align-items: center;
      padding-top: 14px;
      border-top: 1px solid var(--border);

    .vf2-itin-price {
      font-family: var(--font-heading);
      font-size: 15px;
      font-weight: 700;
      color: var(--vermilion);
    }

    /* FAQ */
    .vf2-faq { background: var(--ivory); }
    .vf2-faq-list {
      max-width: 820px;
      margin: 0 auto;
    }
    .vf2-faq-item {

      margin-bottom: 12px;
      overflow: hidden;
      transition: all 0.2s;

    .vf2-faq-item.open {
      border-color: var(--warm-gold);

    .vf2-faq-q {
      width: 100%;

      border: none;
      text-align: left;

      display: flex;
      align-items: center;
      gap: 16px;
      font-family: var(--font-body);
    }
    .vf2-faq-num {
      font-family: var(--font-heading);
      font-size: 14px;
      font-weight: 700;
      color: var(--warm-gold);
      flex-shrink: 0;
    }
    .vf2-faq-question {

      font-size: 15px;
      font-weight: 600;
      color: var(--indigo-deep);
      line-height: 1.5;
    }
    .vf2-faq-icon {
      font-size: 22px;
      color: var(--vermilion);

      flex-shrink: 0;
    }
    .vf2-faq-a {

    }
    .vf2-faq-item.open .vf2-faq-a {
      max-height: 400px;
    }
    .vf2-faq-a p {
      padding: 0 24px 20px 56px;
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    /* Bottom CTA */
    .vf2-bottom-cta { padding: 80px 0; }
    .vf2-cta-card {
      background: linear-gradient(135deg, var(--indigo-deep), var(--indigo));
      border-radius: 20px;
      padding: 56px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 40px;
      position: relative;
      overflow: hidden;
    }
    .vf2-cta-card::before {
      content: '';

      height: 400px;
      background: radial-gradient(circle, rgba(201, 169, 97, 0.15) 0%, transparent 65%);

    .vf2-cta-text h2 {
      font-family: var(--font-heading);
      font-size: 32px;
      color: var(--ivory);
      margin: 0 0 10px;
    }
    .vf2-cta-text p {
      color: rgba(250, 246, 238, 0.7);
      margin: 0;
      font-size: 16px;
    }

    /* ===== Blog Page V2 ===== */
    .blog-page.v2 { padding-top: 72px; }

    .blog2-hero {
      background: linear-gradient(135deg, var(--indigo-deep) 0%, #1a2759 50%, var(--indigo) 100%);
      padding: 90px 0 80px;
      text-align: center;
      color: var(--ivory);
      position: relative;
      overflow: hidden;
    }
    .blog2-hero::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -5%;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(184, 52, 46, 0.2) 0%, transparent 60%);
    }
    .blog2-hero::after {
      content: '';
      position: absolute;
      bottom: -40%;

      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(201, 169, 97, 0.15) 0%, transparent 60%);

    .blog2-eyebrow {
      display: inline-block;

      font-weight: 600;
      color: var(--warm-gold);
      letter-spacing: 2px;

    .blog2-hero-title {
      font-family: var(--font-heading);

    .blog2-content {
      padding: 60px 0;
      background: var(--ivory);
    }
    .blog2-layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 40px;

    /* Featured post */
    .blog2-featured {
      margin-bottom: 40px;

      border-radius: 16px;

      text-decoration: none;
      color: inherit;

    .blog2-featured-cover {
      min-height: 340px;
      position: relative;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .blog2-featured-badge {
      align-self: flex-start;
      padding: 4px 12px;
      background: var(--warm-gold);
      color: white;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;

      font-size: 14px;

      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;

      font-weight: 500;

    .blog2-avatar-sm {

    .blog2-cat-chip:hover {
      border-color: var(--vermilion);
      color: var(--vermilion);

    .blog2-cat-chip.active {
      background: var(--vermilion);
      border-color: var(--vermilion);
      color: white;

      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }
    .blog2-card {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      transition: all 0.3s;
    }
    .blog2-card:hover {

      color: var(--muted);

      -webkit-box-orient: vertical;

      color: var(--ink);

    .blog2-avatar-xs {

      height: 22px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--warm-gold), var(--vermilion));

      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--muted);

    .blog-dot { opacity: 0.4; }

    /* Cover gradients */

    .blog-cover-3 { background: linear-gradient(135deg, #2E7D32, #66BB6A, #C9A961); }
    .blog-cover-4 { background: linear-gradient(135deg, #6A1B9A, #AB47BC, #D4544E); }
    .blog-cover-5 { background: linear-gradient(135deg, #E65100, #FF9800, #C9A961); }
    .blog-cover-6 { background: linear-gradient(135deg, #00695C, #26A69A, #66BB6A); }
    .blog-cover-7 { background: linear-gradient(135deg, #4527A0, #7E57C2, #B8342E); }

    /* Load more */

      text-align: center;
      margin-top: 40px;
    }
    .blog2-nomore {
      display: inline-block;
      padding: 12px 24px;
      color: var(--muted);
      font-size: 13px;
    }

    .blog2-empty {

      padding: 60px 20px;
      color: var(--muted);

// Context provider for language
const LanguageContext = React.createContext();

function LanguageProvider({ children }) {
  const [lang, setLang] = React.useState(() => {
    if (typeof window !== 'undefined') {
      const saved = localStorage.getItem('vc-lang');
      return saved === 'zh' ? 'zh' : 'en';
    }
    return 'en';
  });

  const toggleLang = React.useCallback(() => {
    setLang(prev => {
      const next = prev === 'en' ? 'zh' : 'en';
      localStorage.setItem('vc-lang', next);
      document.documentElement.lang = next === 'zh' ? 'zh-CN' : 'en';
      return next;
    });
  }, []);

  const t = translations[lang];

  React.useEffect(() => {
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  }, [lang]);

  return (
    <LanguageContext.Provider value={{ lang, setLang, toggleLang, t, domesticFlights, globalFlights }}>
      {children}
    </LanguageContext.Provider>
  );
}

function useLang() {
  return React.useContext(LanguageContext);
}

// Scroll reveal hook
function useScrollReveal() {
  React.useEffect(() => {
    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            observer.unobserve(entry.target);
          }
        });
      },
      { threshold: 0.12, rootMargin: '0px 0px -40px 0px' }
    );

    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    return () => observer.disconnect();
  }, []);
}

Object.assign(window, {
  LanguageProvider,
  LanguageContext,
  useLang,
  useScrollReveal,
  translations,
  domesticFlights,
  globalFlights,
});

  <script type="text/babel">
// Navbar.jsx — Desktop nav with dropdowns + mobile hamburger

function Navbar({ onNavigate, currentRoute }) {
  const { lang, toggleLang, t } = useLang();
  const [scrolled, setScrolled] = React.useState(false);
  const [mobileOpen, setMobileOpen] = React.useState(false);

  React.useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 40);
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  // Prevent body scroll when mobile menu open
  React.useEffect(() => {
    document.body.style.overflow = mobileOpen ? 'hidden' : '';
    return () => { document.body.style.overflow = ''; };
  }, [mobileOpen]);

  const nav = t.nav;

  const go = (path) => (e) => {
    e.preventDefault();
    setMobileOpen(false);
    if (onNavigate) onNavigate(path);
  };

  const dropdownItems = {
    flights: [
      { icon: 'Plane', title: nav.domesticRoutes, desc: nav.domesticRoutesDesc, href: '#flights' },
      { icon: 'Globe', title: nav.globalRoutes, desc: nav.globalRoutesDesc, href: '#flights' },
    ],
    travel: [
      { icon: 'Compass', title: nav.customTours, desc: nav.customToursDesc, href: '#travel' },
      { icon: 'User', title: nav.tourGuide, desc: nav.tourGuideDesc, href: '#travel' },
      { icon: 'Ticket', title: nav.attractions, desc: nav.attractionsDesc, href: '#travel' },
      { icon: 'Hotel', title: nav.hotels, desc: nav.hotelsDesc, href: '#travel' },
      { icon: 'Popcorn', title: nav.localDeals, desc: nav.localDealsDesc, href: '#travel' },
    ],
    shop: [
      { icon: 'ShoppingBag', title: nav.chinaShopping, desc: nav.chinaShoppingDesc, href: '#shop' },
      { icon: 'Diamond', title: nav.premiumDeals, desc: nav.premiumDealsDesc, href: '#shop' },
    ],
    medical: [
      { icon: 'Heart', title: nav.massage, desc: nav.massageDesc, href: '#medical' },
      { icon: 'Droplet', title: nav.weightLoss, desc: nav.weightLossDesc, href: '#medical' },
      { icon: 'Acupuncture', title: nav.acupuncture, desc: nav.acupunctureDesc, href: '#medical' },
      { icon: 'Scissors', title: nav.hairTransplant, desc: nav.hairTransplantDesc, href: '#medical' },
      { icon: 'Sparkles', title: nav.lightAesthetics, desc: nav.lightAestheticsDesc, href: '#medical' },
    ],
  };

  const renderIcon = (name, size = 18) => {
    const IconComp = Icon[name];
    return IconComp ? React.createElement(IconComp, { size }) : null;
  };

  const NavItem = ({ label, items, align = 'center', routePath }) => (
    <li className="nav-item">
      <a
        className="nav-link"
        href={routePath ? `#${routePath}` : `#${label.toLowerCase()}`}
        onClick={routePath ? go(routePath) : undefined}
      >
        {label}
        <Icon.ChevronDown size={12} />
      </a>
      <div className="dropdown">
        {items.map((item, idx) => (
          <a
            key={idx}
            className="dropdown-item"
            href={item.href || '#'}
            onClick={item.href ? (e) => { if (onNavigate) { e.preventDefault(); onNavigate(item.href.replace('#', '')); } } : undefined}
          >
            <div className="dropdown-item-icon">{renderIcon(item.icon)}</div>
            <div className="dropdown-item-text">
              <h4>{item.title}</h4>
              <p>{item.desc}</p>
            </div>
          </a>
        ))}
      </div>
    </li>
  );

  return (
    <>
      <nav className={`nav ${scrolled ? 'scrolled' : ''}`}>
        {/* Logo */}
        <a href="#" className="nav-logo">
          <span className="nav-logo-mark">
            <Icon.LogoMark size={18} />
          </span>
          VisitChina
        </a>

        {/* Desktop menu */}
        <ul className="nav-menu">
          <NavItem label={nav.flightDeals} items={dropdownItems.flights} routePath="flights" />
          <NavItem label={nav.travelChina} items={dropdownItems.travel} />
          <NavItem label={nav.shopChina} items={dropdownItems.shop} />
          <NavItem label={nav.medicalChina} items={dropdownItems.medical} />
          <li className="nav-item">
            <a className="nav-link" href="#visa" onClick={go('visa')}>{nav.visaFree}</a>
          </li>
        </ul>

        {/* Right side */}
        <div className="nav-right">
          <button className="lang-toggle" onClick={toggleLang} aria-label="Toggle language">
            <span className={`lang-option ${lang === 'en' ? 'active' : ''}`}>EN</span>
            <span className="lang-sep"></span>
            <span className={`lang-option ${lang === 'zh' ? 'active' : ''}`}>中文</span>
          </button>
          <a href="#flights" className="btn btn-primary btn-sm" onClick={go('flights')}>
            {nav.startPlanning}
          </a>
          <button
            className={`hamburger ${mobileOpen ? 'open' : ''}`}
            onClick={() => setMobileOpen(!mobileOpen)}
            aria-label="Toggle menu"
          >
            <span></span>
            <span></span>
            <span></span>
          </button>
        </div>
      </nav>

      {/* Mobile menu */}
      <div className={`mobile-menu ${mobileOpen ? 'open' : ''}`}>
        <MobileNavGroup label={nav.flightDeals} items={dropdownItems.flights} onClose={() => setMobileOpen(false)} />
        <MobileNavGroup label={nav.travelChina} items={dropdownItems.travel} onClose={() => setMobileOpen(false)} />
        <MobileNavGroup label={nav.shopChina} items={dropdownItems.shop} onClose={() => setMobileOpen(false)} />
        <MobileNavGroup label={nav.medicalChina} items={dropdownItems.medical} onClose={() => setMobileOpen(false)} />

        <div className="mobile-nav-group">
          <div className="mobile-nav-label">{nav.visaFree}</div>
          <a className="mobile-nav-item" href="#visa" onClick={go('visa')}>
            <div className="mobile-nav-item-icon"><Icon.Clock size={16} /></div>
            <span>{nav.visaFree}</span>
          </a>
        </div>

        <div style={{ paddingTop: '24px', display: 'flex', gap: '12px' }}>
          <button
            className="btn btn-primary"
            style={{ flex: 1 }}
            onClick={go('flights')}
          >
            {nav.startPlanning}
          </button>
        </div>
      </div>
    </>
  );
}

function MobileNavGroup({ label, items, onClose }) {
  return (
    <div className="mobile-nav-group">
      <div className="mobile-nav-label">{label}</div>
      {items.map((item, idx) => {
        const IconComp = Icon[item.icon];
        const handleClick = (e) => {
          if (item.action) {
            item.action(e);
          } else if (item.href) {
            e.preventDefault();
            const id = item.href.replace('#', '');
            const el = document.getElementById(id);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
          if (onClose) onClose();
        };
        return (
          <a key={idx} className="mobile-nav-item" href={item.href || '#'} onClick={handleClick}>
            <div className="mobile-nav-item-icon">
              {IconComp ? React.createElement(IconComp, { size: 16 }) : null}
            </div>
            <span>{item.title}</span>
          </a>
        );
      })}
    </div>
  );
}

Object.assign(window, { Navbar });

  </script>

// FlightDeals.jsx — Domestic & Global flight deal cards with tabs

  const { t, lang, domesticFlights, globalFlights } = useLang();

    if (lang === 'zh') return `¥${priceCNY.toLocaleString('zh-CN')}`;
    return `$${priceUSD}`;
  };

  const formatOriginal = (priceUSD, priceCNY) => {
    if (lang === 'zh') return `¥${priceCNY.toLocaleString('zh-CN')}`;
    return `$${priceUSD}`;
  };

  const cityName = (en, zh) => (lang === 'zh' ? zh : en);

  return (
    <section id="flights" className="section section-indigo">
      <div className="container">
        <div className="section-header reveal">
          <div className="eyebrow">{f.eyebrow}</div>
          <h2>
            {f.title}
            <span style={{ color: 'var(--warm-gold-light)', fontWeight: 400, fontStyle: 'italic' }}>
              {f.subtitle}

          <p style={{ marginTop: '16px' }}>{f.subtitleFull}</p>

            onClick={() => setActiveTab('domestic')}

          <button
            className={`flight-tab ${activeTab === 'global' ? 'active' : ''}`}
            onClick={() => setActiveTab('global')}
          >
            {f.tabGlobal}
          </button>
        </div>

        {/* Flight cards */}
        <div className="flight-grid">
          {flights.map((flight, idx) => (
            <div
              key={`${activeTab}-${idx}`}
              className="flight-card card-hover reveal"
              style={{ transitionDelay: `${(idx % 3) * 0.1}s` }}
            >
              <div className="flight-route">
                <div>
                  <div className="flight-city">{cityName(flight.from, flight.fromZh)}</div>
                  <div className="flight-city-code">{flight.fromCode}</div>

                <div className="flight-arrow">
                  <Icon.Plane size={18} />

                    {flight.tag && (
                      <span className="flight-deal-tag-inline">{f.dealTag}</span>

                  <span className="flight-price-original">
                    {formatOriginal(flight.original, flight.originalZh)}
                  </span>
                </div>
                <button className="btn btn-primary btn-sm">{f.bookNow}</button>
              </div>
            </div>
          ))}
        </div>

  <script type="text/babel">
// DigitalHumanAdvisor.jsx — Floating AI travel advisor with chat panel

function DigitalHumanAdvisor({ onNavigate }) {
  const { t, lang } = useLang();
  const dh = t.digitalHuman;
  const [isOpen, setIsOpen] = React.useState(false);
  const [showBubble, setShowBubble] = React.useState(true);
  const [messages, setMessages] = React.useState([]);
  const [inputVal, setInputVal] = React.useState('');
  const [isTyping, setIsTyping] = React.useState(false);
  const [isSpeaking, setIsSpeaking] = React.useState(false);
  const chatEndRef = React.useRef(null);
  const bubbleTimerRef = React.useRef(null);

  // Initial greeting
  React.useEffect(() => {
    setMessages([
      { role: 'bot', text: dh.greeting, id: 'greeting' }
    ]);
  }, [lang]);

  // Auto-hide bubble after 5s
  React.useEffect(() => {
    if (!isOpen && showBubble) {
      bubbleTimerRef.current = setTimeout(() => {
        setShowBubble(false);
      }, 5000);
    }
    return () => {
      if (bubbleTimerRef.current) clearTimeout(bubbleTimerRef.current);
    };
  }, [isOpen, showBubble]);

  // Scroll to bottom when messages change
  React.useEffect(() => {
    if (chatEndRef.current) {
      chatEndRef.current.scrollTop = chatEndRef.current.scrollHeight;
    }
  }, [messages, isTyping]);

  const toggleChat = () => {
    setIsOpen(prev => !prev);
    if (!isOpen) {
      setShowBubble(false);
    }
  };

  const handleMouseEnter = () => {
    if (!isOpen) {
      setShowBubble(true);
      if (bubbleTimerRef.current) clearTimeout(bubbleTimerRef.current);
    }
  };

  const handleMouseLeave = () => {
    if (!isOpen) {
      bubbleTimerRef.current = setTimeout(() => setShowBubble(false), 2000);
    }
  };

  const getReplyForQuestion = (index) => {
    const replies = [
      { text: dh.replyDestinations, action: 'planning', linkText: dh.viewPlanning, linkRoute: 'planning' },
      { text: dh.replyFlights, action: 'flights', linkText: dh.viewFlights, linkRoute: 'flights' },
      { text: dh.replyVisa, action: 'visa', linkText: dh.viewVisa, linkRoute: null },
      { text: dh.replyTour, action: 'planning', linkText: dh.viewPlanning, linkRoute: 'planning' },
      { text: dh.replyMedical, action: 'medical', linkText: dh.viewMedical, linkRoute: null },
    ];
    return replies[index] || { text: dh.replyGeneric };
  };

  const matchKeyword = (text) => {
    const lower = text.toLowerCase();
    if (lang === 'zh') {
      if (lower.includes('目的地') || lower.includes('推荐') || lower.includes('城市') || lower.includes('去哪')) return 0;
      if (lower.includes('机票') || lower.includes('飞机') || lower.includes('航班')) return 1;
      if (lower.includes('免签') || lower.includes('签证') || lower.includes('过境')) return 2;
      if (lower.includes('定制') || lower.includes('行程') || lower.includes('规划') || lower.includes('报价')) return 3;
      if (lower.includes('医疗') || lower.includes('医美') || lower.includes('按摩') || lower.includes('康养')) return 4;
    } else {
      if (lower.includes('destination') || lower.includes('city') || lower.includes('recommend') || lower.includes('where')) return 0;
      if (lower.includes('flight') || lower.includes('plane') || lower.includes('ticket') || lower.includes('air')) return 1;
      if (lower.includes('visa') || lower.includes('transit') || lower.includes('free')) return 2;
      if (lower.includes('tour') || lower.includes('custom') || lower.includes('itinerary') || lower.includes('plan') || lower.includes('quote')) return 3;
      if (lower.includes('medical') || lower.includes('wellness') || lower.includes('massage') || lower.includes('aesthetic')) return 4;
    }
    return -1;
  };

  const sendBotReply = (replyData) => {
    setIsTyping(true);
    setIsSpeaking(true);

    // "speaking" animation duration
    setTimeout(() => setIsSpeaking(false), 1500);

    const delay = 800 + Math.random() * 800;
    setTimeout(() => {
      setIsTyping(false);
      setMessages(prev => [...prev, {
        role: 'bot',
        text: replyData.text,
        linkText: replyData.linkText,
        linkRoute: replyData.linkRoute,
        id: Date.now().toString()
      }]);
    }, delay);
  };

  const handleQuickQuestion = (index) => {
    const question = dh.quickQuestions[index];
    setMessages(prev => [...prev, { role: 'user', text: question, id: 'q-' + index + '-' + Date.now() }]);
    const reply = getReplyForQuestion(index);
    sendBotReply(reply);
  };

  const handleSend = () => {
    if (!inputVal.trim()) return;
    const userText = inputVal.trim();
    setInputVal('');
    setMessages(prev => [...prev, { role: 'user', text: userText, id: 'u-' + Date.now() }]);

    const matchIdx = matchKeyword(userText);
    if (matchIdx >= 0) {
      const reply = getReplyForQuestion(matchIdx);
      sendBotReply(reply);
    } else {
      sendBotReply({ text: dh.replyGeneric });
    }
  };

  const handleKeyDown = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  };

  const handleLinkClick = (route) => {
    setIsOpen(false);
    if (route === 'planning' || route === 'flights') {
      if (onNavigate) onNavigate(route);
      else window.location.hash = `/${route}`;
    } else if (route === 'visa') {
      if (onNavigate) onNavigate('home');
      // Scroll to visa section after short delay
      setTimeout(() => {
        const el = document.querySelector('#visa-section, .visa-section, [data-section="visa"]');
        if (el) el.scrollIntoView({ behavior: 'smooth' });
        else window.scrollTo({ top: window.innerHeight * 3, behavior: 'smooth' });
      }, 100);
    } else if (route === 'medical') {
      if (onNavigate) onNavigate('home');
      setTimeout(() => {
        const el = document.querySelector('#medical-section, .medical-section, [data-section="medical"]');
        if (el) el.scrollIntoView({ behavior: 'smooth' });
        else window.scrollTo({ top: window.innerHeight * 4, behavior: 'smooth' });
      }, 100);
    }
  };

  const renderMessage = (msg) => {
    if (msg.role === 'user') {
      return (
        <div key={msg.id} className="chat-msg user-msg">
          <div className="msg-bubble">{msg.text}</div>
        </div>
      );
    }
    return (
      <div key={msg.id} className="chat-msg bot-msg">
        <div className="msg-avatar">
          <DigitalAvatar size={32} isSpeaking={false} />
        </div>
        <div className="msg-content">
          <div
            className="msg-bubble bot-bubble"
            dangerouslySetInnerHTML={{ __html: msg.text.replace(/\n/g, '<br/>') }}
          />
          {msg.linkText && (
            <button
              className="msg-link-btn"
              onClick={() => handleLinkClick(msg.linkRoute || msg.action)}
            >
              {msg.linkText}
            </button>
          )}
        </div>
      </div>
    );
  };

  return (
    <>
      {/* Overlay when chat open on mobile */}
      {isOpen && <div className="dh-overlay" onClick={toggleChat} />}

      {/* Chat panel */}
      <div className={`dh-chat-panel ${isOpen ? 'open' : ''}`}>
        {/* Header */}
        <div className="dh-chat-header">
          <div className="dh-header-info">
            <div className="dh-header-avatar">
              <DigitalAvatar size={40} isSpeaking={isSpeaking} />
              <span className="dh-online-dot"></span>
            </div>
            <div className="dh-header-text">
              <div className="dh-name">{dh.name} <span className="dh-role">— {dh.role}</span></div>
              <div className="dh-status">
                <span className="dh-status-dot"></span>
                {dh.online}
              </div>
            </div>
          </div>
          <button className="dh-close-btn" onClick={toggleChat} aria-label={dh.close}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        {/* Messages */}
        <div className="dh-chat-body" ref={chatEndRef}>
          {messages.map(renderMessage)}
          {isTyping && (
            <div className="chat-msg bot-msg">
              <div className="msg-avatar">
                <DigitalAvatar size={32} isSpeaking={true} />
              </div>
              <div className="msg-bubble bot-bubble typing-bubble">
                <div className="typing-dots">
                  <span></span>
                  <span></span>
                  <span></span>
                </div>
              </div>
            </div>
          )}
        </div>

        {/* Quick questions */}
        {messages.length <= 2 && !isTyping && (
          <div className="dh-quick-questions">
            {dh.quickQuestions.map((q, idx) => (
              <button
                key={idx}
                className="quick-question-btn"
                onClick={() => handleQuickQuestion(idx)}
              >
                {q}
              </button>
            ))}
          </div>
        )}

        {/* Input */}
        <div className="dh-chat-input">
          <input
            type="text"
            placeholder={dh.inputPlaceholder}
            value={inputVal}
            onChange={(e) => setInputVal(e.target.value)}
            onKeyDown={handleKeyDown}
          />
          <button className="dh-send-btn" onClick={handleSend} disabled={!inputVal.trim()}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
      </div>

      {/* Floating avatar button */}
      <div
        className={`dh-fab-wrapper ${isOpen ? 'hidden' : ''}`}
        onMouseEnter={handleMouseEnter}
        onMouseLeave={handleMouseLeave}
      >
        {/* Bubble tooltip */}
        {showBubble && (
          <div className="dh-bubble">
            {dh.bubble}
            <span className="dh-bubble-arrow"></span>
          </div>
        )}

        {/* Avatar button */}
        <button
          className="dh-fab"
          onClick={toggleChat}
          aria-label={dh.role}
        >
          <div className="dh-fab-pulse"></div>
          <div className="dh-fab-inner">
            <DigitalAvatar size={56} isSpeaking={false} />
          </div>
        </button>
      </div>
    </>
  );
}

// SVG-based digital human avatar (friendly Asian female with headset)
function DigitalAvatar({ size = 48, isSpeaking = false }) {

    <div className={`digital-avatar ${isSpeaking ? 'speaking' : ''}`} style={{ width: size, height: size }}>
      <svg viewBox="0 0 64 64" width={size} height={size}>
        {/* Background circle */}
        <defs>

          <linearGradient id="dh-face-grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stopColor="#F5DCC4" />
            <stop offset="100%" stopColor="#E8C4A0" />

          <linearGradient id="dh-hair-grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stopColor="#2C1810" />
            <stop offset="100%" stopColor="#1A0E08" />
          </linearGradient>
        </defs>

        {/* Background */}
        <circle cx="32" cy="32" r="32" fill="url(#dh-bg-grad)" />

        {/* Hair back */}
        <path d="M 16 30 Q 16 14 32 12 Q 48 14 48 30 L 48 40 Q 46 34 44 32 L 20 32 Q 18 34 16 40 Z" fill="url(#dh-hair-grad)" />

        {/* Face */}
        <ellipse cx="32" cy="36" rx="14" ry="16" fill="url(#dh-face-grad)" />

        {/* Hair bangs */}
        <path d="M 18 28 Q 20 18 32 18 Q 44 18 46 28 Q 42 24 32 24 Q 22 24 18 28" fill="url(#dh-hair-grad)" />

        {/* Eyes */}
        <ellipse cx="26" cy="34" rx="2" ry="2.5" fill="#2C1810" />
        <ellipse cx="38" cy="34" rx="2" ry="2.5" fill="#2C1810" />
        {/* Eye shine */}
        <circle cx="26.5" cy="33" r="0.7" fill="white" opacity="0.8" />
        <circle cx="38.5" cy="33" r="0.7" fill="white" opacity="0.8" />

        {/* Eyebrows */}
        <path d="M 23 30.5 Q 26 29.5 29 30.5" stroke="#2C1810" strokeWidth="1.2" fill="none" strokeLinecap="round" />
        <path d="M 35 30.5 Q 38 29.5 41 30.5" stroke="#2C1810" strokeWidth="1.2" fill="none" strokeLinecap="round" />

        {/* Nose */}
        <path d="M 32 36 Q 31 39 32 40" stroke="#C89B78" strokeWidth="1" fill="none" strokeLinecap="round" />

        {/* Mouth (smile) */}
        <path d="M 28 42 Q 32 45 36 42" stroke="#B8342E" strokeWidth="1.5" fill="none" strokeLinecap="round" className="dh-mouth" />
        <path d="M 29 42.5 Q 32 44.5 35 42.5" fill="#D4544E" opacity="0.4" />

        {/* Cheeks */}
        <ellipse cx="23" cy="40" rx="3" ry="2" fill="#E8A7A0" opacity="0.5" />
        <ellipse cx="41" cy="40" rx="3" ry="2" fill="#E8A7A0" opacity="0.5" />

        {/* Headset mic on left */}
        <path d="M 13 34 L 10 34 L 10 40 Q 10 42 12 42 L 13 42" stroke="#1E2A5E" strokeWidth="2" fill="none" strokeLinecap="round" />
        <circle cx="12" cy="42" r="2.5" fill="#1E2A5E" />
        <circle cx="12" cy="42" r="1" fill="#C9A961" />

        {/* Headset band over head */}
        <path d="M 13 24 Q 13 14 32 12 Q 45 13 49 22" stroke="#1E2A5E" strokeWidth="1.5" fill="none" strokeLinecap="round" />

        {/* Earring */}
        <circle cx="18" cy="40" r="1.5" fill="#C9A961" />
        <circle cx="46" cy="40" r="1.5" fill="#C9A961" />
      </svg>
    </div>
  );
}

Object.assign(window, { DigitalHumanAdvisor, DigitalAvatar });

  </script>

function App() {
  useScrollReveal();

  const scrollTo = (id) => (e) => {
    if (e) e.preventDefault();
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };

  return (
    <LanguageProvider>
      <div className="app">
        <Navbar onNavigate={scrollTo} currentRoute="home" />
        <main>
          <Hero onNavigate={scrollTo} />
          <TrustBar />
          <FlightDeals onNavigate={scrollTo} />
          <TravelChina />
          <ShopChina />
          <MedicalChina />
          <VisaFree onNavigate={scrollTo} />
          <Testimonials />
        </main>
        <Footer />
        <DigitalHumanAdvisor onNavigate={scrollTo} />
      </div>
    </LanguageProvider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
