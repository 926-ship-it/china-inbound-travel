      margin: 0 0 12px;
    }
    .vf-section-sub {
      color: var(--muted);
      max-width: 600px;
      margin: 0 auto;
      font-size: 16px;
    }

    .vf-section-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
    }
    .vf-section-text p {
      color: var(--muted);
      line-height: 1.8;
      margin: 16px 0 24px;
    }
    .vf-what-points {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .vf-what-points li {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 0;
      color: var(--ink);
      font-size: 15px;
    }
    .vf-check-mark {
      color: var(--celadon);
      font-weight: 700;
      font-size: 16px;
      flex-shrink: 0;
    }

    .vf-passport-card {
      background: linear-gradient(135deg, var(--indigo-deep), var(--indigo));
      border-radius: 16px;
      padding: 28px;
      color: var(--ivory);
      box-shadow: 0 20px 60px rgba(30, 42, 94, 0.3);
    }
    .vf-passport-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(250, 246, 238, 0.15);
      margin-bottom: 20px;
    }
    .vf-passport-type {
      font-size: 14px;
      font-weight: 700;
      color: var(--warm-gold);
    }
    .vf-passport-sub {
      font-size: 11px;
      color: rgba(250, 246, 238, 0.6);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .vf-passport-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid rgba(250, 246, 238, 0.08);
    }
    .vf-passport-row:last-child { border-bottom: none; }
    .vf-passport-row span {
      font-size: 13px;
      color: rgba(250, 246, 238, 0.6);
    }
    .vf-passport-row strong {
      font-size: 14px;
      color: var(--ivory);
    }

    /* Countries */
    .vf-countries-section { background: var(--ivory); }
    .vf-countries-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 32px;
    }
    .vf-country-group h3 {
      font-family: var(--font-heading);
      font-size: 18px;
      color: var(--indigo-deep);
      margin: 0 0 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--warm-gold);
      display: inline-block;
    }
    .vf-country-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .vf-country-tag {
      padding: 6px 14px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 13px;
      color: var(--ink);
      transition: all 0.2s;
    }
    .vf-country-tag:hover {
      border-color: var(--vermilion);
      color: var(--vermilion);
      transform: translateY(-1px);
    }

    /* Ports */
    .vf-ports-map-wrap {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 30px rgba(30, 42, 94, 0.08);
      border: 1px solid var(--border);
      margin-bottom: 32px;
    }
    .vf-ports-map { width: 100%; height: auto; }
    .vf-ports-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .vf-port-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 24px;
      font-size: 13px;
      color: var(--ink);
    }
    .vf-port-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--vermilion);
    }
    .vf-port-more {
      background: var(--warm-gold-light);
      border-color: var(--warm-gold);
      color: var(--indigo-deep);
      font-weight: 600;
    }

    /* Process */
    .vf-process-section { background: var(--ivory); }
    .vf-process-steps {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
      position: relative;
    }
    .vf-step {
      background: white;
      border-radius: 16px;
      padding: 32px 24px 28px;
      text-align: center;
      border: 1px solid var(--border);
      position: relative;
      transition: all 0.3s;
    }
    .vf-step:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(30, 42, 94, 0.1);
      border-color: var(--warm-gold);
    }
    .vf-step-num {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--vermilion), var(--vermilion-light));
      color: white;
      font-family: var(--font-heading);
      font-size: 22px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }
    .vf-step h3 {
      font-family: var(--font-heading);
      font-size: 17px;
      color: var(--indigo-deep);
      margin: 0 0 8px;
    }
    .vf-step p {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
      margin: 0;
    }

    /* Notes */
    .vf-notes-card {
      background: linear-gradient(135deg, #FFF8E7, #FFEFE0);
      border-radius: 16px;
      padding: 40px;
      display: flex;
      gap: 28px;
      border: 1px solid rgba(201, 169, 97, 0.3);
    }
    .vf-notes-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--warm-gold);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .vf-notes-content h2 {
      font-family: var(--font-heading);
      font-size: 24px;
      color: var(--indigo-deep);
      margin: 0 0 16px;
    }
    .vf-notes-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 24px;
    }
    .vf-notes-list li {
      position: relative;
      padding-left: 24px;
      font-size: 14px;
      color: var(--ink);
      line-height: 1.5;
    }
    .vf-notes-list li::before {
      content: '!';
      position: absolute;
      left: 0;
      top: 2px;
      width: 16px;
      height: 16px;
      background: var(--vermilion);
      color: white;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Itineraries */
    .vf-itin-section { background: var(--ivory); }
    .vf-itin-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }
    .vf-itin-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      transition: all 0.3s;
    }
    .vf-itin-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 40px rgba(30, 42, 94, 0.12);
    }
    .vf-itin-cover {
      height: 140px;
      position: relative;
      display: flex;
      align-items: flex-end;
      padding: 16px;
    }
    .vf-itin-cover-0 { background: linear-gradient(135deg, #B8342E, #D4544E); }
    .vf-itin-cover-1 { background: linear-gradient(135deg, #2E7D32, #66BB6A); }
    .vf-itin-cover-2 { background: linear-gradient(135deg, #1565C0, #42A5F5); }
    .vf-itin-cover-3 { background: linear-gradient(135deg, #6A1B9A, #AB47BC); }
    .vf-itin-days {
      background: rgba(0,0,0,0.3);
      color: white;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      backdrop-filter: blur(4px);
    }
    .vf-itin-body { padding: 20px; }
    .vf-itin-title {
      font-family: var(--font-heading);
      font-size: 16px;
      color: var(--indigo-deep);
      margin: 0 0 12px;
      line-height: 1.4;
    }
    .vf-itin-cities {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }
    .vf-itin-city {
      padding: 3px 10px;
      background: var(--ivory);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 11px;
      color: var(--muted);
    }
    .vf-itin-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .vf-itin-audience {
      font-size: 11px;
      color: var(--muted);
    }
    .vf-itin-price {
      font-size: 14px;
      font-weight: 700;
      color: var(--vermilion);
    }
    .vf-itin-btn { width: 100%; justify-content: center; }

    /* FAQ */
    .vf-faq-list {
      max-width: 800px;
      margin: 0 auto;
    }
    .vf-faq-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 12px;
      background: white;
      overflow: hidden;
      transition: all 0.2s;
    }
    .vf-faq-item.open {
      border-color: var(--warm-gold);
      box-shadow: 0 4px 16px rgba(201, 169, 97, 0.15);
    }
    .vf-faq-q {
      width: 100%;
      padding: 20px 24px;
      background: none;
      border: none;
      text-align: left;
      font-size: 16px;
      font-weight: 600;
      color: var(--indigo-deep);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      font-family: var(--font-body);
    }
    .vf-faq-icon {
      font-size: 20px;
      color: var(--vermilion);
      font-weight: 300;
      flex-shrink: 0;
    }
    .vf-faq-a {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease, padding 0.3s ease;
    }
    .vf-faq-item.open .vf-faq-a {
      max-height: 300px;
      padding: 0 24px 20px;
    }
    .vf-faq-a p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    /* CTA */
    .vf-cta-section { padding: 80px 0; }
    .vf-cta-card {
      background: linear-gradient(135deg, var(--indigo-deep), var(--indigo));
      border-radius: 20px;
      padding: 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 40px;
      position: relative;
      overflow: hidden;
    }
    .vf-cta-card::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -10%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(201, 169, 97, 0.15) 0%, transparent 70%);
    }
    .vf-cta-text h2 {
      font-family: var(--font-heading);
      font-size: 32px;
      color: var(--ivory);
      margin: 0 0 10px;
    }
    .vf-cta-text p {
      color: rgba(250, 246, 238, 0.7);
      margin: 0;
      font-size: 16px;
    }

    /* ===== Blog Page ===== */
    .blog-page { padding-top: 72px; }

    .blog-hero {
      background: linear-gradient(135deg, var(--indigo-deep) 0%, var(--indigo) 100%);
      padding: 80px 0 70px;
      text-align: center;
      color: var(--ivory);
      position: relative;
      overflow: hidden;
    }
    .blog-hero::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(184, 52, 46, 0.2) 0%, transparent 60%);
    }
    .blog-hero::after {
      content: '';
      position: absolute;
      bottom: -50%;
      right: -10%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(201, 169, 97, 0.15) 0%, transparent 60%);
    }
    .blog-hero-eyebrow {
      display: inline-block;
      padding: 6px 16px;
      background: rgba(201, 169, 97, 0.2);
      border: 1px solid rgba(201, 169, 97, 0.4);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: var(--warm-gold);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 20px;
      position: relative;
    }
    .blog-hero-title {
      font-family: var(--font-heading);
      font-size: 48px;
      font-weight: 700;
      margin: 0 0 16px;
      position: relative;
    }
    .blog-hero-sub {
      font-size: 17px;
      color: rgba(250, 246, 238, 0.75);
      max-width: 600px;
      margin: 0 auto;
      position: relative;
    }

    .blog-content {
      padding: 60px 0;
      background: var(--ivory);
    }
    .blog-layout {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 48px;
    }

    /* Toolbar */
    .blog-toolbar {
      margin-bottom: 36px;
    }
    .blog-search {
      position: relative;
      margin-bottom: 20px;
    }
    .blog-search svg {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
    }
    .blog-search input {
      width: 100%;
      padding: 14px 16px 14px 48px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      font-family: var(--font-body);
      background: white;
      outline: none;
      transition: all 0.2s;
    }
    .blog-search input:focus {
      border-color: var(--vermilion);
      box-shadow: 0 0 0 3px rgba(184, 52, 46, 0.1);
    }
    .blog-categories {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .blog-cat-btn {
      padding: 8px 16px;
      border: 1.5px solid var(--border);
      border-radius: 20px;
      background: white;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: var(--font-body);
    }
    .blog-cat-btn:hover {
      border-color: var(--vermilion);
      color: var(--vermilion);
    }
    .blog-cat-btn.active {
      background: var(--vermilion);
      border-color: var(--vermilion);
      color: white;
    }

    /* Featured */
    .blog-featured {
      margin-bottom: 40px;
    }
    .blog-featured-link {
      text-decoration: none;
      color: inherit;
    }
    .blog-featured { background: white; border-radius: 16px; overflow: hidden; border: 1px solid var(--border); transition: all 0.3s; }
    .blog-featured:hover { box-shadow: 0 12px 40px rgba(30, 42, 94, 0.1); transform: translateY(-2px); }
    .blog-featured { display: grid; grid-template-columns: 1fr 1fr; }
    .blog-featured-cover {
      min-height: 320px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }
    .blog-featured-badge {
      align-self: flex-start;
      background: var(--warm-gold);
      color: white;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .blog-featured-body { padding: 32px; }
    .blog-featured-title {
      font-family: var(--font-heading);
      font-size: 28px;
      font-weight: 700;
      color: var(--indigo-deep);
      margin: 12px 0 16px;
      line-height: 1.3;
    }
    .blog-featured-excerpt {
      color: var(--muted);
      line-height: 1.7;
      margin: 0 0 20px;
      font-size: 15px;
    }
    .blog-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .blog-meta.small { font-size: 12px; margin-bottom: 12px; }
    .blog-dot { opacity: 0.4; }
    .blog-read-more {
      color: var(--vermilion);
      font-weight: 600;
      font-size: 14px;
    }

    /* Cover gradients */
    .blog-cover-0 { background: linear-gradient(135deg, #B8342E, #D4544E, #C9A961); }
    .blog-cover-1 { background: linear-gradient(135deg, #1E2A5E, #2E4080, #1565C0); }
    .blog-cover-2 { background: linear-gradient(135deg, #2E7D32, #66BB6A, #C9A961); }
    .blog-cover-3 { background: linear-gradient(135deg, #6A1B9A, #AB47BC, #D4544E); }
    .blog-cover-4 { background: linear-gradient(135deg, #E65100, #FF9800, #C9A961); }
    .blog-cover-5 { background: linear-gradient(135deg, #00695C, #26A69A, #66BB6A); }
    .blog-cover-6 { background: linear-gradient(135deg, #4527A0, #7E57C2, #B8342E); }
    .blog-cover-7 { background: linear-gradient(135deg, #00838F, #26C6DA, #1565C0); }

    /* Article grid */
    .blog-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }
    .blog-card {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      transition: all 0.3s;
    }
    .blog-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(30, 42, 94, 0.1);
    }
    .blog-card a { text-decoration: none; color: inherit; display: block; }
    .blog-card-cover {
      height: 180px;
      position: relative;
      padding: 16px;
      display: flex;
      align-items: flex-start;
    }
    .blog-tag {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(250, 246, 238, 0.95);
      color: var(--vermilion);
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
      backdrop-filter: blur(4px);
    }
    .blog-tag.large {
      padding: 6px 16px;
      font-size: 13px;
      margin-bottom: 16px;
    }
    .blog-card-body { padding: 20px; }
    .blog-card-title {
      font-family: var(--font-heading);
      font-size: 17px;
      font-weight: 700;
      color: var(--indigo-deep);
      margin: 0 0 10px;
      line-height: 1.4;
    }
    .blog-card-excerpt {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
      margin: 0 0 14px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .blog-card-author {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }
    .blog-author-avatar-mini {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--warm-gold), var(--vermilion));
      color: white;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .blog-empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    /* Pagination */
    .blog-pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 48px;
    }
    .blog-page-btn {
      padding: 10px 20px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: white;
      color: var(--ink);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: var(--font-body);
    }
    .blog-page-btn:hover:not(:disabled) {
      border-color: var(--vermilion);
      color: var(--vermilion);
    }
    .blog-page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .blog-page-nums { display: flex; gap: 6px; }
    .blog-page-num {
      width: 38px;
      height: 38px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      background: white;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: var(--font-body);
    }
    .blog-page-num.active {
      background: var(--vermilion);
      border-color: var(--vermilion);
      color: white;
    }
    .blog-page-num:hover:not(.active) {
      border-color: var(--vermilion);
      color: var(--vermilion);
    }

    /* Sidebar */
    .blog-sidebar {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .blog-side-widget {
      background: white;
      border-radius: 14px;
      padding: 24px;
      border: 1px solid var(--border);
    }
    .blog-side-title {
      font-family: var(--font-heading);
      font-size: 16px;
      color: var(--indigo-deep);
      margin: 0 0 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--warm-gold);
      display: inline-block;
    }
    .blog-popular-list {
      list-style: none;
      padding: 0;
      margin: 0;
      counter-reset: pop;
    }
    .blog-popular-list li {
      counter-increment: pop;
      border-bottom: 1px solid var(--border);
      padding: 12px 0;
    }
    .blog-popular-list li:last-child { border-bottom: none; }
    .blog-popular-list a {
      display: flex;
      gap: 14px;
      text-decoration: none;
      color: inherit;
    }
    .blog-pop-rank {
      font-family: var(--font-heading);
      font-size: 24px;
      font-weight: 700;
      color: var(--border);
      line-height: 1;
      flex-shrink: 0;
    }
    .blog-popular-list li:nth-child(-n+3) .blog-pop-rank { color: var(--vermilion); }
    .blog-pop-info { flex: 1; min-width: 0; }
    .blog-pop-cat {
      font-size: 11px;
      color: var(--vermilion);
      font-weight: 600;
      margin-bottom: 4px;
      display: block;
    }
    .blog-pop-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      margin: 0;
      line-height: 1.4;
    }

    .blog-newsletter-widget p {
      font-size: 13px;
      color: var(--muted);
      margin: 0 0 14px;
      line-height: 1.6;
    }
    .blog-newsletter-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .blog-newsletter-form input {
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      font-family: var(--font-body);
      outline: none;
    }
    .blog-newsletter-form input:focus { border-color: var(--vermilion); }
    .blog-newsletter-form .btn { width: 100%; justify-content: center; }

    .blog-social-row {
      display: flex;
      gap: 10px;
    }
    .blog-social-btn {
      flex: 1;
      height: 42px;
      border-radius: 10px;
      background: var(--ivory);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--indigo);
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .blog-social-btn:hover {
      background: var(--vermilion);
      color: white;
      border-color: var(--vermilion);
    }

    /* ===== Blog Article Page ===== */
    .blog-article-page { padding-top: 72px; background: white; }

    .blog-article-cover {
      padding: 80px 0 60px;
      color: var(--ivory);
      position: relative;
    }
    .blog-article-cover-inner {
      position: relative;
      z-index: 1;
      max-width: 760px;
    }
    .blog-back-link {
      color: rgba(250, 246, 238, 0.8);
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 24px;
      display: inline-block;
      transition: color 0.2s;
    }
    .blog-back-link:hover { color: var(--warm-gold); }
    .blog-article-title {
      font-family: var(--font-heading);
      font-size: 42px;
      font-weight: 700;
      line-height: 1.25;
      margin: 16px 0 24px;
      color: var(--ivory);
    }
    .blog-article-meta { margin-top: 20px; }
    .blog-article-author {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .blog-author-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--warm-gold);
      color: var(--indigo-deep);
      font-family: var(--font-heading);
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .blog-author-name {
      font-weight: 600;
      font-size: 15px;
    }
    .blog-author-date {
      font-size: 12px;
      color: rgba(250, 246, 238, 0.7);
      margin-top: 4px;
    }

    .blog-article-body {
      max-width: 760px;
      margin: 0 auto;
      padding: 60px 0;
    }
    .blog-article-content h2 {
      font-family: var(--font-heading);
      font-size: 28px;
      font-weight: 700;
      color: var(--indigo-deep);
      margin: 48px 0 16px;
    }
    .blog-article-content h3 {
      font-family: var(--font-heading);
      font-size: 20px;
      font-weight: 700;
      color: var(--indigo-deep);
      margin: 32px 0 12px;
    }

      letter-spacing: 1px;
      margin: 0 0 4px;

      font-size: 20px;
      color: var(--indigo-deep);
      margin: 0 0 8px;
    }
    .blog-author-card p {
      font-size: 14px;
      color: var(--muted);

    /* Related */

      border-top: 1px solid var(--border);
    }
    .blog-related h2 {

      color: var(--indigo-deep);
      margin: 0 0 24px;
    }
    .blog-related-grid {

      padding-top: 48px;
      border-top: 1px solid var(--border);

      margin-bottom: 32px;

      font-size: 14px;

    }
    .blog-comment-avatar {

      height: 40px;

      align-items: center;
      justify-content: center;

      padding: 2px 8px;
      background: var(--ivory);
      border-radius: 10px;
      color: var(--muted);

    .blog-comment-body p { margin: 0; font-size: 14px; line-height: 1.7; color: #333; }



    /* ===== BlogCover Component ===== */
    .blog-cover {
      position: relative;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }
    .blog-cover-illustration {
      position: absolute;

      height: 100%;

    }
    .blog-cover-overlay {
      position: absolute;

      background: linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(0,0,0,0.25) 100%);

      position: relative;
      z-index: 2;

      flex-direction: column;
      justify-content: space-between;

    .blog2-featured-badge {

      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;

    /* Article cover text adjustments */

    .blog2-article-inner {

    .blog2-back-link {

    /* Inline article image */

    /* ====== Visa Free Page V2 ====== */
    .visa-free-page.v2 { padding-top: 72px; }

    .vf2-hero {

    .vf2-section-title {
      font-family: var(--font-heading);

    .vf2-stat-card {

      -webkit-text-fill-color: transparent;

    .vf2-stat-label {
      display: block;
      font-size: 18px;

      font-size: 13px;
      color: var(--muted);
      margin: 0;
      line-height: 1.5;
    }

    /* Compare table */
    .vf2-compare {
      background: white;
      border-radius: 16px;
      padding: 36px;
      border: 1px solid var(--border);
    }
    .vf2-compare-title {
      font-family: var(--font-heading);
      font-size: 24px;
      color: var(--indigo-deep);
      margin: 0 0 6px;
      text-align: center;
    }
    .vf2-compare-sub {
      text-align: center;
      color: var(--muted);
      margin: 0 0 24px;
      font-size: 14px;
    }
    .vf2-compare-table {
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .vf2-compare-row {
      display: grid;
      grid-template-columns: 1fr 1.2fr 1.2fr;
    }
    .vf2-compare-row.head .vf2-compare-cell {
      background: var(--indigo-deep);
      color: var(--ivory);
      font-weight: 600;
      padding: 14px 20px;

      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);

      font-weight: 600;
      color: var(--indigo-deep);
      background: var(--ivory);
    }
    .vf2-compare-cell.a { color: var(--ink); }
    .vf2-compare-cell.b {
      color: var(--ink);
      background: rgba(201, 169, 97, 0.06);
      font-weight: 500;
    }
    .vf2-compare-row.head .vf2-compare-cell.b {
      background: var(--vermilion);
      color: white;
    }

    /* Eligibility checker */
    .vf-checker-section { padding: 0 0 80px; margin-top: -60px; position: relative; z-index: 10; }
    .vf-checker-card {
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 10px 40px rgba(30, 42, 94, 0.12);
      border: 1px solid var(--border);
    }
    .vf-checker-header { text-align: center; margin-bottom: 28px; }

      font-family: var(--font-heading);
      font-size: 26px;
      margin: 8px 0 8px;
      color: var(--indigo-deep);
    }
    .vf-checker-header p { color: var(--muted); margin: 0; font-size: 15px; }
    .vf-checker-form {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 16px;
      align-items: end;
    }
    .vf-form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 8px;
    }
    .vf-form-group select {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 14px;

      background: white;
      color: var(--ink);
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;

    .vf-result-icon {
      width: 48px; height: 48px;

    .vf-result-note { font-size: 12px !important; color: var(--muted) !important; margin-top: 8px !important; }

      font-family: var(--font-heading);

      color: var(--indigo-deep);
      margin: 0 0 16px;

    .vf2-provinces { margin-bottom: 40px; }
    .vf2-province-grid {

    .vf2-province-chip {

    .vf2-port-types {

    /* Process section */

    .vf2-process-layout {

      grid-template-columns: 1fr 1fr;
      gap: 40px;

    .vf2-cond-icon {

      height: 36px;
      border-radius: 50%;

      font-weight: 600;
      color: var(--indigo-deep);

    .vf2-cond-item p {
      margin: 0;
      font-size: 13px;
      color: var(--muted);

    .vf2-step-list {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .vf2-step-item {
      display: flex;
      gap: 20px;
      position: relative;
    }
    .vf2-step-num {

      height: 44px;

      color: var(--warm-gold);

      font-weight: 600;
      color: var(--indigo-deep);

    .vf2-step-body p {
      margin: 0;
      font-size: 13px;
      color: var(--muted);

    .vf2-step-line {

    .vf2-notes-card {

    .vf2-notes-icon {

      height: 48px;

      background: var(--warm-gold);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;

    .vf2-notes-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 24px;
    }
    .vf2-notes-list li {
      position: relative;
      padding-left: 22px;
      font-size: 14px;
      color: var(--ink);
      line-height: 1.5;
    }
    .vf2-notes-list li::before {
      content: '!';
      position: absolute;
      left: 0; top: 2px;
      width: 16px; height: 16px;
      background: var(--vermilion);
      color: white;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Itineraries */
    .vf2-itin-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }
    .vf2-itin-card {
      background: white;
      border-radius: 16px;

      border: 1px solid var(--border);
      transition: all 0.3s;
      display: flex;
      flex-direction: column;
    }
    .vf2-itin-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 48px rgba(30, 42, 94, 0.14);
    }
    .vf2-itin-cover {
      height: 120px;
      padding: 16px;
      position: relative;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: space-between;

    .vf2-itin-cover-0 { background: linear-gradient(135deg, #B8342E, #D4544E, #C9A961); }
    .vf2-itin-cover-1 { background: linear-gradient(135deg, #2E7D32, #66BB6A, #C9A961); }
    .vf2-itin-cover-2 { background: linear-gradient(135deg, #1565C0, #42A5F5, #B8342E); }
    .vf2-itin-cover-3 { background: linear-gradient(135deg, #6A1B9A, #AB47BC, #C9A961); }
    .vf2-itin-route {

      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      flex-wrap: wrap;

    .vf2-itin-arrow { opacity: 0.7; }
    .vf2-itin-days {
      align-self: flex-start;
      padding: 4px 12px;
      background: rgba(0,0,0,0.25);
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      backdrop-filter: blur(4px);

    .vf2-itin-body {
      padding: 18px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .vf2-itin-title {
      font-family: var(--font-heading);
      font-size: 16px;
      font-weight: 700;
      color: var(--indigo-deep);
      margin: 0 0 12px;
      line-height: 1.4;

    .vf2-itin-highlights-label {

      color: var(--muted);

    .vf2-itin-highlights {
      display: flex;

      gap: 6px;

    }
    .vf2-itin-tag {

      background: var(--ivory);

      font-size: 11px;
      color: var(--muted);

    .vf2-itin-footer {
      margin-top: auto;

      justify-content: space-between;
      align-items: center;
      padding-top: 14px;
      border-top: 1px solid var(--border);

    .vf2-itin-price {
      font-family: var(--font-heading);
      font-size: 15px;
      font-weight: 700;
      color: var(--vermilion);
    }

    /* FAQ */
    .vf2-faq { background: var(--ivory); }
    .vf2-faq-list {
      max-width: 820px;
      margin: 0 auto;
    }
    .vf2-faq-item {

      margin-bottom: 12px;
      overflow: hidden;
      transition: all 0.2s;

    .vf2-faq-item.open {
      border-color: var(--warm-gold);

    .vf2-faq-q {
      width: 100%;

      border: none;
      text-align: left;

      display: flex;
      align-items: center;
      gap: 16px;
      font-family: var(--font-body);
    }
    .vf2-faq-num {
      font-family: var(--font-heading);
      font-size: 14px;
      font-weight: 700;
      color: var(--warm-gold);
      flex-shrink: 0;
    }
    .vf2-faq-question {

      font-size: 15px;
      font-weight: 600;
      color: var(--indigo-deep);
      line-height: 1.5;
    }
    .vf2-faq-icon {
      font-size: 22px;
      color: var(--vermilion);

      flex-shrink: 0;
    }
    .vf2-faq-a {

    }
    .vf2-faq-item.open .vf2-faq-a {
      max-height: 400px;
    }
    .vf2-faq-a p {
      padding: 0 24px 20px 56px;
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    /* Bottom CTA */
    .vf2-bottom-cta { padding: 80px 0; }
    .vf2-cta-card {
      background: linear-gradient(135deg, var(--indigo-deep), var(--indigo));
      border-radius: 20px;
      padding: 56px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 40px;
      position: relative;
      overflow: hidden;
    }
    .vf2-cta-card::before {
      content: '';

      height: 400px;
      background: radial-gradient(circle, rgba(201, 169, 97, 0.15) 0%, transparent 65%);

    .vf2-cta-text h2 {
      font-family: var(--font-heading);
      font-size: 32px;
      color: var(--ivory);
      margin: 0 0 10px;
    }
    .vf2-cta-text p {
      color: rgba(250, 246, 238, 0.7);
      margin: 0;
      font-size: 16px;
    }

    /* ===== Blog Page V2 ===== */
    .blog-page.v2 { padding-top: 72px; }

    .blog2-hero {
      background: linear-gradient(135deg, var(--indigo-deep) 0%, #1a2759 50%, var(--indigo) 100%);
      padding: 90px 0 80px;
      text-align: center;
      color: var(--ivory);
      position: relative;
      overflow: hidden;
    }
    .blog2-hero::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -5%;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(184, 52, 46, 0.2) 0%, transparent 60%);
    }
    .blog2-hero::after {
      content: '';
      position: absolute;
      bottom: -40%;

      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(201, 169, 97, 0.15) 0%, transparent 60%);

    .blog2-eyebrow {
      display: inline-block;

      font-weight: 600;
      color: var(--warm-gold);
      letter-spacing: 2px;

    .blog2-hero-title {
      font-family: var(--font-heading);

    .blog2-content {
      padding: 60px 0;
      background: var(--ivory);
    }
    .blog2-layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 40px;

    /* Featured post */
    .blog2-featured {
      margin-bottom: 40px;

      border-radius: 16px;

      text-decoration: none;
      color: inherit;

    .blog2-featured-cover {
      min-height: 340px;
      position: relative;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .blog2-featured-badge {
      align-self: flex-start;
      padding: 4px 12px;
      background: var(--warm-gold);
      color: white;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;

      font-size: 14px;

      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;

      font-weight: 500;

    .blog2-avatar-sm {

    .blog2-cat-chip:hover {
      border-color: var(--vermilion);
      color: var(--vermilion);

    .blog2-cat-chip.active {
      background: var(--vermilion);
      border-color: var(--vermilion);
      color: white;

      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }
    .blog2-card {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      transition: all 0.3s;
    }
    .blog2-card:hover {

      color: var(--muted);

      -webkit-box-orient: vertical;

      color: var(--ink);

    .blog2-avatar-xs {

      height: 22px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--warm-gold), var(--vermilion));

      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--muted);

    .blog-dot { opacity: 0.4; }

    /* Cover gradients */

    .blog-cover-3 { background: linear-gradient(135deg, #2E7D32, #66BB6A, #C9A961); }
    .blog-cover-4 { background: linear-gradient(135deg, #6A1B9A, #AB47BC, #D4544E); }
    .blog-cover-5 { background: linear-gradient(135deg, #E65100, #FF9800, #C9A961); }
    .blog-cover-6 { background: linear-gradient(135deg, #00695C, #26A69A, #66BB6A); }
    .blog-cover-7 { background: linear-gradient(135deg, #4527A0, #7E57C2, #B8342E); }

    /* Load more */

      text-align: center;
      margin-top: 40px;
    }
    .blog2-nomore {
      display: inline-block;
      padding: 12px 24px;
      color: var(--muted);
      font-size: 13px;
    }

    .blog2-empty {

      padding: 60px 20px;
      color: var(--muted);

// Context provider for language
const LanguageContext = React.createContext();

function LanguageProvider({ children }) {
  const [lang, setLang] = React.useState(() => {
    if (typeof window !== 'undefined') {
      const saved = localStorage.getItem('vc-lang');
      return saved === 'zh' ? 'zh' : 'en';
    }
    return 'en';
  });

  const toggleLang = React.useCallback(() => {
    setLang(prev => {
      const next = prev === 'en' ? 'zh' : 'en';
      localStorage.setItem('vc-lang', next);
      document.documentElement.lang = next === 'zh' ? 'zh-CN' : 'en';
      return next;
    });
  }, []);

  const t = translations[lang];

  React.useEffect(() => {
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  }, [lang]);

  return (
    <LanguageContext.Provider value={{ lang, setLang, toggleLang, t, domesticFlights, globalFlights }}>
      {children}
    </LanguageContext.Provider>
  );
}

function useLang() {
  return React.useContext(LanguageContext);
}

// Scroll reveal hook
function useScrollReveal() {
  React.useEffect(() => {
    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            observer.unobserve(entry.target);
          }
        });
      },
      { threshold: 0.12, rootMargin: '0px 0px -40px 0px' }
    );

    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    return () => observer.disconnect();
  }, []);
}

Object.assign(window, {
  LanguageProvider,
  LanguageContext,
  useLang,
  useScrollReveal,
  translations,
  domesticFlights,
  globalFlights,
});

// router.jsx — Simple hash-based router for multi-page navigation

function useRoute() {
  const [route, setRoute] = React.useState(() => {
    const hash = window.location.hash.replace(/^#\//, '');
    return hash || 'home';
  });

  React.useEffect(() => {
    const onHashChange = () => {
      const hash = window.location.hash.replace(/^#\//, '');
      setRoute(hash || 'home');
      window.scrollTo({ top: 0, behavior: 'instant' });
    };
    window.addEventListener('hashchange', onHashChange);
    return () => window.removeEventListener('hashchange', onHashChange);
  }, []);

  const navigate = React.useCallback((path) => {
    window.location.hash = `/${path}`;
  }, []);

  // Re-run scroll reveal when route changes (new content with .reveal classes)
  React.useEffect(() => {
    if (typeof useScrollReveal !== 'undefined') {
      // Tiny delay to let DOM render
      const timer = setTimeout(() => {
        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach(entry => {
              if (entry.isIntersecting) {
                entry.target.classList.add('is-visible');
                observer.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.12, rootMargin: '0px 0px -40px 0px' }
        );
        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
      }, 50);
      return () => clearTimeout(timer);
    }
  }, [route]);

  return { route, navigate };
}

Object.assign(window, { useRoute });

  // Filter
  let flights = [...allFlights];
  if (filterLimited) flights = flights.filter(f => f.tag);
  if (filterDirect) flights = flights.filter(f => f.direct !== 0);

  // Sort
  if (sortByPrice) {
    flights.sort((a, b) => a.price - b.price);
  }

  const toggleExpand = (idx) => {
    setExpandedCard(expandedCard === idx ? null : idx);

  <script type="text/babel">
// DigitalHumanAdvisor.jsx — Floating AI travel advisor with chat panel

function DigitalHumanAdvisor({ onNavigate }) {
  const { t, lang } = useLang();
  const dh = t.digitalHuman;
  const [isOpen, setIsOpen] = React.useState(false);
  const [showBubble, setShowBubble] = React.useState(true);
  const [messages, setMessages] = React.useState([]);
  const [inputVal, setInputVal] = React.useState('');
  const [isTyping, setIsTyping] = React.useState(false);
  const [isSpeaking, setIsSpeaking] = React.useState(false);
  const chatEndRef = React.useRef(null);
  const bubbleTimerRef = React.useRef(null);

  // Initial greeting
  React.useEffect(() => {
    setMessages([
      { role: 'bot', text: dh.greeting, id: 'greeting' }
    ]);
  }, [lang]);

  // Auto-hide bubble after 5s
  React.useEffect(() => {
    if (!isOpen && showBubble) {
      bubbleTimerRef.current = setTimeout(() => {
        setShowBubble(false);
      }, 5000);
    }
    return () => {
      if (bubbleTimerRef.current) clearTimeout(bubbleTimerRef.current);
    };
  }, [isOpen, showBubble]);

  // Scroll to bottom when messages change
  React.useEffect(() => {
    if (chatEndRef.current) {
      chatEndRef.current.scrollTop = chatEndRef.current.scrollHeight;
    }
  }, [messages, isTyping]);

  const toggleChat = () => {
    setIsOpen(prev => !prev);
    if (!isOpen) {
      setShowBubble(false);
    }
  };

  const handleMouseEnter = () => {
    if (!isOpen) {
      setShowBubble(true);
      if (bubbleTimerRef.current) clearTimeout(bubbleTimerRef.current);
    }
  };

  const handleMouseLeave = () => {
    if (!isOpen) {
      bubbleTimerRef.current = setTimeout(() => setShowBubble(false), 2000);
    }
  };

  const getReplyForQuestion = (index) => {
    const replies = [
      { text: dh.replyDestinations, action: 'planning', linkText: dh.viewPlanning, linkRoute: 'planning' },
      { text: dh.replyFlights, action: 'flights', linkText: dh.viewFlights, linkRoute: 'flights' },
      { text: dh.replyVisa, action: 'visa', linkText: dh.viewVisa, linkRoute: null },
      { text: dh.replyTour, action: 'planning', linkText: dh.viewPlanning, linkRoute: 'planning' },
      { text: dh.replyMedical, action: 'medical', linkText: dh.viewMedical, linkRoute: null },
    ];
    return replies[index] || { text: dh.replyGeneric };
  };

  const matchKeyword = (text) => {
    const lower = text.toLowerCase();
    if (lang === 'zh') {
      if (lower.includes('目的地') || lower.includes('推荐') || lower.includes('城市') || lower.includes('去哪')) return 0;
      if (lower.includes('机票') || lower.includes('飞机') || lower.includes('航班')) return 1;
      if (lower.includes('免签') || lower.includes('签证') || lower.includes('过境')) return 2;
      if (lower.includes('定制') || lower.includes('行程') || lower.includes('规划') || lower.includes('报价')) return 3;
      if (lower.includes('医疗') || lower.includes('医美') || lower.includes('按摩') || lower.includes('康养')) return 4;
    } else {
      if (lower.includes('destination') || lower.includes('city') || lower.includes('recommend') || lower.includes('where')) return 0;
      if (lower.includes('flight') || lower.includes('plane') || lower.includes('ticket') || lower.includes('air')) return 1;
      if (lower.includes('visa') || lower.includes('transit') || lower.includes('free')) return 2;
      if (lower.includes('tour') || lower.includes('custom') || lower.includes('itinerary') || lower.includes('plan') || lower.includes('quote')) return 3;
      if (lower.includes('medical') || lower.includes('wellness') || lower.includes('massage') || lower.includes('aesthetic')) return 4;
    }
    return -1;
  };

  const sendBotReply = (replyData) => {
    setIsTyping(true);
    setIsSpeaking(true);

    // "speaking" animation duration
    setTimeout(() => setIsSpeaking(false), 1500);

    const delay = 800 + Math.random() * 800;
    setTimeout(() => {
      setIsTyping(false);
      setMessages(prev => [...prev, {
        role: 'bot',
        text: replyData.text,
        linkText: replyData.linkText,
        linkRoute: replyData.linkRoute,
        id: Date.now().toString()
      }]);
    }, delay);
  };

  const handleQuickQuestion = (index) => {
    const question = dh.quickQuestions[index];
    setMessages(prev => [...prev, { role: 'user', text: question, id: 'q-' + index + '-' + Date.now() }]);
    const reply = getReplyForQuestion(index);
    sendBotReply(reply);
  };

  const handleSend = () => {
    if (!inputVal.trim()) return;
    const userText = inputVal.trim();
    setInputVal('');
    setMessages(prev => [...prev, { role: 'user', text: userText, id: 'u-' + Date.now() }]);

    const matchIdx = matchKeyword(userText);
    if (matchIdx >= 0) {
      const reply = getReplyForQuestion(matchIdx);
      sendBotReply(reply);
    } else {
      sendBotReply({ text: dh.replyGeneric });
    }
  };

  const handleKeyDown = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  };

  const handleLinkClick = (route) => {
    setIsOpen(false);
    if (route === 'planning' || route === 'flights') {
      if (onNavigate) onNavigate(route);
      else window.location.hash = `/${route}`;
    } else if (route === 'visa') {
      if (onNavigate) onNavigate('home');
      // Scroll to visa section after short delay
      setTimeout(() => {
        const el = document.querySelector('#visa-section, .visa-section, [data-section="visa"]');
        if (el) el.scrollIntoView({ behavior: 'smooth' });
        else window.scrollTo({ top: window.innerHeight * 3, behavior: 'smooth' });
      }, 100);
    } else if (route === 'medical') {
      if (onNavigate) onNavigate('home');
      setTimeout(() => {
        const el = document.querySelector('#medical-section, .medical-section, [data-section="medical"]');
        if (el) el.scrollIntoView({ behavior: 'smooth' });
        else window.scrollTo({ top: window.innerHeight * 4, behavior: 'smooth' });
      }, 100);
    }
  };

  const renderMessage = (msg) => {
    if (msg.role === 'user') {
      return (
        <div key={msg.id} className="chat-msg user-msg">
          <div className="msg-bubble">{msg.text}</div>
        </div>
      );
    }
    return (
      <div key={msg.id} className="chat-msg bot-msg">
        <div className="msg-avatar">
          <DigitalAvatar size={32} isSpeaking={false} />
        </div>
        <div className="msg-content">
          <div
            className="msg-bubble bot-bubble"
            dangerouslySetInnerHTML={{ __html: msg.text.replace(/\n/g, '<br/>') }}
          />
          {msg.linkText && (
            <button
              className="msg-link-btn"
              onClick={() => handleLinkClick(msg.linkRoute || msg.action)}
            >
              {msg.linkText}
            </button>
          )}
        </div>
      </div>
    );
  };

  return (
    <>
      {/* Overlay when chat open on mobile */}
      {isOpen && <div className="dh-overlay" onClick={toggleChat} />}

      {/* Chat panel */}
      <div className={`dh-chat-panel ${isOpen ? 'open' : ''}`}>
        {/* Header */}
        <div className="dh-chat-header">
          <div className="dh-header-info">
            <div className="dh-header-avatar">
              <DigitalAvatar size={40} isSpeaking={isSpeaking} />
              <span className="dh-online-dot"></span>
            </div>
            <div className="dh-header-text">
              <div className="dh-name">{dh.name} <span className="dh-role">— {dh.role}</span></div>
              <div className="dh-status">
                <span className="dh-status-dot"></span>
                {dh.online}
              </div>
            </div>
          </div>
          <button className="dh-close-btn" onClick={toggleChat} aria-label={dh.close}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        {/* Messages */}
        <div className="dh-chat-body" ref={chatEndRef}>
          {messages.map(renderMessage)}
          {isTyping && (
            <div className="chat-msg bot-msg">
              <div className="msg-avatar">
                <DigitalAvatar size={32} isSpeaking={true} />
              </div>
              <div className="msg-bubble bot-bubble typing-bubble">
                <div className="typing-dots">
                  <span></span>
                  <span></span>
                  <span></span>
                </div>
              </div>
            </div>
          )}
        </div>

        {/* Quick questions */}
        {messages.length <= 2 && !isTyping && (
          <div className="dh-quick-questions">
            {dh.quickQuestions.map((q, idx) => (
              <button
                key={idx}
                className="quick-question-btn"
                onClick={() => handleQuickQuestion(idx)}
              >
                {q}
              </button>
            ))}
          </div>
        )}

        {/* Input */}
        <div className="dh-chat-input">
          <input
            type="text"
            placeholder={dh.inputPlaceholder}
            value={inputVal}
            onChange={(e) => setInputVal(e.target.value)}
            onKeyDown={handleKeyDown}
          />
          <button className="dh-send-btn" onClick={handleSend} disabled={!inputVal.trim()}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
      </div>

      {/* Floating avatar button */}
      <div
        className={`dh-fab-wrapper ${isOpen ? 'hidden' : ''}`}
        onMouseEnter={handleMouseEnter}
        onMouseLeave={handleMouseLeave}
      >
        {/* Bubble tooltip */}
        {showBubble && (
          <div className="dh-bubble">
            {dh.bubble}
            <span className="dh-bubble-arrow"></span>
          </div>
        )}

        {/* Avatar button */}
        <button
          className="dh-fab"
          onClick={toggleChat}
          aria-label={dh.role}
        >
          <div className="dh-fab-pulse"></div>
          <div className="dh-fab-inner">
            <DigitalAvatar size={56} isSpeaking={false} />
          </div>
        </button>
      </div>
    </>
  );
}

// SVG-based digital human avatar (friendly Asian female with headset)
function DigitalAvatar({ size = 48, isSpeaking = false }) {
